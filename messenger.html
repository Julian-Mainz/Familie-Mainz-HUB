            <aside class="ms-list">
                <div class="ms-head">
                    <h2>Chats</h2>
                    <button class="ms-ib" id="b-newchat" onclick="openNewChat()" title="Neuer Chat" aria-label="Neuer Chat"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button class="ms-ib hidden" id="b-newgroup" onclick="openNewGroup()" title="Neue Gruppe" aria-label="Neue Gruppe"><i class="fa-solid fa-user-group"></i></button>
                    <button class="ms-ib" onclick="openSettings()" title="Einstellungen" aria-label="Einstellungen"><i class="fa-solid fa-sliders"></i></button>
                </div>
                <div class="ms-search"><i class="fa-solid fa-magnifying-glass"></i><input class="ms-in" id="ms-q" placeholder="Chats durchsuchen" oninput="renderList()" autocomplete="off"></div>
                <div id="ms-chats"></div>
            </aside>

            <section class="ms-conv">
                <div class="ms-empty" id="ms-none"><div class="big"><i class="fa-solid fa-comments"></i></div><h3>Schreib los</h3><p>Wähle links einen Chat oder starte mit dem Stift oben einen neuen. Nachrichten erscheinen sofort bei der anderen Person.</p></div>
                <div id="ms-chat" class="hidden" style="display:none;flex-direction:column;min-height:0;flex:1">
                    <div class="ms-ch">
                        <button class="ms-ib ms-back" onclick="closeChat()" aria-label="Zurück"><i class="fa-solid fa-arrow-left"></i></button>
                        <span id="ms-hav"></span>
                        <div class="t" id="ms-title" onclick="openInfo()"><b></b><small></small></div>
                        <button class="ms-ib" onclick="toggleSearch()" title="Im Chat suchen" aria-label="Im Chat suchen"><i class="fa-solid fa-magnifying-glass"></i></button>
                        <button class="ms-ib" id="b-mute" onclick="toggleMute()" title="Stummschalten" aria-label="Stummschalten"><i class="fa-solid fa-bell"></i></button>
                        <button class="ms-ib hidden" id="b-info" onclick="openInfo()" title="Gruppe" aria-label="Gruppe"><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                    <div class="ms-sbar hidden" id="ms-sbar"><input class="ms-in plain" id="ms-sq" placeholder="Im Chat suchen" oninput="runSearch()" autocomplete="off" style="padding:8px 12px"><span id="ms-scount"></span>
                        <button class="ms-ib" style="width:32px;height:32px" onclick="stepHit(-1)" aria-label="Vorheriger Treffer"><i class="fa-solid fa-chevron-up"></i></button><button class="ms-ib" style="width:32px;height:32px" onclick="stepHit(1)" aria-label="Nächster Treffer"><i class="fa-solid fa-chevron-down"></i></button>
                        <button class="ms-ib" style="width:32px;height:32px" onclick="toggleSearch(false)" aria-label="Suche schließen"><i class="fa-solid fa-xmark"></i></button></div>
                    <div id="ms-scroll"></div>
                    <button id="ms-jump" class="hidden" onclick="scrollDown(true)" aria-label="Zu den neuesten Nachrichten" title="Nach unten"><i class="fa-solid fa-arrow-down"></i><span id="ms-jn"></span></button>
                    <div class="ms-bar hidden" id="ms-rbar"></div>
                    <div class="ms-comp">
                        <button class="ms-ib" id="b-emo" onclick="openEmoji(event)" title="Emojis" aria-label="Emojis"><i class="fa-regular fa-face-smile"></i></button>
                        <button class="ms-ib" id="b-img" onclick="$('ms-file').click()" title="Bild senden" aria-label="Bild senden"><i class="fa-solid fa-image"></i></button>
                        <input type="file" id="ms-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                        <textarea id="ms-input" rows="1" maxlength="2000" placeholder="Nachricht schreiben" aria-label="Nachricht"></textarea>
                        <button class="ms-send" id="ms-send" onclick="doSend()" aria-label="Senden"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </section>
        </div>
</main>

    <div id="ms-layer"></div>

    <script src="/js/pages/messenger.js?v=8ee28a51" defer></script>
</body>
</html>
