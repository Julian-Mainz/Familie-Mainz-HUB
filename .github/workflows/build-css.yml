name: CSS bauen

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'js/**'
      - 'assets/*.css'
      - 'Uhr/**'
      - 'Keks/**'
      - 'icons/**'
      - 'manifest.json'
      - 'firebase-messaging-sw.js'
      - 'build-css.mjs'
      - 'package.json'
      - '.github/workflows/build-css.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Nur ein Build gleichzeitig: Ein neuer Lauf ersetzt einen noch laufenden älteren
concurrency:
  group: build-css
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: CSS bauen
        run: node build-css.mjs

      - name: Versionsnummer schreiben
        run: echo "{\"build\":\"$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}\"}" > version.json

      - name: Ergebnis speichern
        id: commit
        run: |
          git config user.name "css-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/css version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Build: CSS und Versionsnummer"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=true; break; fi
              sleep 5
            done
            if [ "$pushed" != "true" ]; then echo "Speichern fehlgeschlagen"; exit 1; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Veröffentlichung anstoßen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
