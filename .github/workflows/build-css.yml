name: CSS bauen

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'js/**'
      - 'build-css.mjs'
      - 'package.json'
      - '.github/workflows/build-css.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: CSS bauen
        run: node build-css.mjs

      - name: Ergebnis speichern
        id: commit
        run: |
          git config user.name "css-build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "CSS neu gebaut"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Veröffentlichung anstoßen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
