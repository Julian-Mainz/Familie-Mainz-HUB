   <label style="color:var(--mu);font-size:12.5px">Sortieren: <select class="sel" id="sort"><option value="last" ${UI.sort === 'last' ? 'selected' : ''}>Zuletzt gespielt</option><option value="name" ${UI.sort === 'name' ? 'selected' : ''}>Name</option><option value="time" ${UI.sort === 'time' ? 'selected' : ''}>Spielzeit</option></select></label></div>
  <div class="grid" id="grid">${cardsHtml(L)}</div>`;
}
const msItem = (m, g) => `<div class="ms ${m.done ? 'd' : ''}" style="--cc:${g.color};--cd:${g.color}2e"><div class="ic">${m.e ? m.e : `<i class="fa-solid fa-${m.done ? 'trophy' : 'lock'}"></i>`}</div><div><b>${esc(m.n)}</b>${m.d ? `<small>${esc(m.d)}</small>` : ''}</div></div>`;
function viewBibliothek(L, id) {
  const S = sortLast(L), cur = S.find(x => x.g.id === id) || S[0], { g, i } = cur, w = wish(), has = !!(id && GBY[id]);
  const side = `<aside class="side"><div class="row" style="justify-content:space-between;padding:0 8px 12px"><h2 class="h">Meine Spiele · ${GAMES.length}</h2></div>${S.map(x => `<a class="it ${x.g.id === g.id ? 'on' : ''}" href="#bibliothek/${x.g.id}"><span class="mini">${artDiv(x.g.id)}</span><span><b>${esc(x.g.name)}</b><small>${ago(x.i.last)}</small></span></a>`).join('')}
   <div style="margin:18px 8px 8px;padding-top:16px;border-top:1px solid var(--ln)"><h2 class="h">Wunschliste · ${w.length}</h2><div style="display:grid;gap:8px;margin-top:12px;color:#b9c4d4;font-size:13.5px">${w.length ? w.map(x => `<div><i class="fa-solid fa-heart" style="color:var(--ac);margin-right:8px"></i>${esc(SBY[x].name)}</div>`).join('') : '<span style="color:var(--mu)">Noch nichts. Herzen setzt du unter „Entdecken“.</span>'}</div></div></aside>`;
  const T = [['ueber', 'Übersicht'], ['miles', g.mileLabel], ['stand', 'Spielstand']], tab = T.some(t => t[0] === UI.tab) ? UI.tab : 'ueber';
  const prog = `<div class="panel"><h2 class="h">Fortschritt</h2>${i.bars.length ? i.bars.map(([a, b, p]) => `<div class="prow"><div class="l"><b>${esc(a)}</b><span>${esc(b)}</span></div>${barHtml(p, p ? g.color : '#475569')}</div>`).join('') : '<div class="note">Noch kein Spielstand. Starte das Spiel, dann erscheint hier dein Fortschritt.</div>'}${i.stats.length ? `<div class="stats">${i.stats.map(([a, b]) => `<div><b>${esc(a)}</b><small>${esc(b)}</small></div>`).join('')}</div>` : ''}</div>`;
  const mile = (n) => `<div class="panel"><h2 class="h">${g.mileLabel}</h2>${i.miles.length ? i.miles.slice(0, n).map(m => msItem(m, g)).join('') + (i.miles.length > n ? `<div style="margin-top:14px"><a class="btn sm" href="#bibliothek/${g.id}/miles">Alle ${i.miles.length} ansehen</a></div>` : '') : '<div class="note">Noch keine Daten.</div>'}</div>`;
  const stand = `<div class="panel"><h2 class="h">Spielstand</h2><div class="row" style="margin:12px 0 14px;font-size:13px;color:#b9c4d4"><i class="fa-solid fa-hard-drive" style="color:var(--mu)"></i>${cur.has ? 'Gespeichert auf diesem Gerät' : 'Noch kein Spielstand auf diesem Gerät'}</div><div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn sm" data-act="export" data-id="${g.id}" ${cur.has ? '' : 'disabled style="opacity:.45"'}>Sichern</button><button class="btn sm" data-act="import" data-id="${g.id}">Einlesen</button><button class="btn sm bad" data-act="reset" data-id="${g.id}" ${cur.has ? '' : 'disabled style="opacity:.45"'}>Zurücksetzen</button></div>
   <div class="note"><i class="fa-solid fa-circle-info" style="margin-right:6px"></i>Schließe das Spiel in anderen Tabs, bevor du einen Spielstand einliest oder zurücksetzt, sonst überschreibt es ihn wieder. Der Stand gilt nur für dieses Gerät und diesen Browser.</div></div>`;
  const body = tab === 'ueber' ? `<div class="two"><div class="col">${prog}<div class="panel"><h2 class="h">Über das Spiel</h2><p class="about">${esc(g.about)}</p></div></div><div class="col">${mile(6)}${stand}</div></div>`
    : tab === 'miles' ? `<div class="panel"><h2 class="h">${g.mileLabel} · ${i.done} von ${i.total}</h2><div class="mgrid">${i.miles.map(m => msItem(m, g)).join('') || '<div class="note">Noch keine Daten.</div>'}</div></div>` : `<div style="max-width:640px">${stand}</div>`;
  return `<div class="lib ${has ? 'sel' : ''}">${side}<section class="detail"><div class="dh">${artDiv(g.id)}<div class="fade"></div></div><div class="dbody"><a class="back mobq" href="#bibliothek" style="margin-bottom:10px"><i class="fa-solid fa-arrow-left"></i>Bibliothek</a><h1>${esc(g.name)}</h1>
   <div class="meta">${playBtn(g, i.played ? 'Spielen' : 'Jetzt spielen', 'big')}${[['Spielzeit', dur(i.playMs)], ['Zuletzt gespielt', ago(i.last)], i.key, [g.mileLabel, `${i.done} von ${i.total}`]].map(([a, b]) => `<div class="m"><div>${esc(a)}</div><div>${esc(b)}</div></div>`).join('')}</div>
   <div class="tabs" role="tablist">${T.map(([k, t]) => `<a href="#bibliothek/${g.id}${k === 'ueber' ? '' : '/' + k}" class="${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}">${t}</a>`).join('')}</div>${body}</div></section></div>`;
}
function viewErfolge(L, P) {
  const gs = UI.erfG === 'alle' ? L : L.filter(x => x.g.id === UI.erfG);
  const groups = gs.map(({ g, i }) => { const m = i.miles.filter(x => UI.erfS === 'alle' || (UI.erfS === 'done') === !!x.done); return `<section class="erf-g"><h3><span class="mini" style="width:34px;height:34px">${artDiv(g.id)}</span>${esc(g.name)}<span style="color:var(--mu);font-size:13px;font-weight:500">${i.done} von ${i.total}</span></h3>${m.length ? `<div class="mgrid">${m.map(x => msItem(x, g)).join('')}</div>` : '<div class="empty" style="padding:6px 0">Hier ist nichts.</div>'}</section>`; }).join('');
  return `<div class="erf-h"><div><b>${P.done} von ${P.total}</b><div style="color:var(--mu);font-size:13px">Erfolge und Meilensteine</div></div><div><b>Level ${P.lvl}</b><div style="color:var(--mu);font-size:13px">${P.xp.toLocaleString('de-DE')} Erfahrungspunkte</div></div><div class="sp"></div>
   <label style="color:var(--mu);font-size:12.5px">Spiel: <select class="sel" id="erfG"><option value="alle">Alle</option>${GAMES.map(g => `<option value="${g.id}" ${UI.erfG === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label><div class="chips">${[['alle', 'Alle'], ['done', 'Freigeschaltet'], ['open', 'Offen']].map(([k, t]) => `<button class="chip ${UI.erfS === k ? 'on' : ''}" data-act="erfs" data-v="${k}">${t}</button>`).join('')}</div></div>
   <div class="note" style="margin:-6px 0 24px">So kommen Erfahrungspunkte zusammen: 40 Punkte für jeden Erfolg oder Meilenstein und 1 Punkt für jede gespielte Minute. Level n beginnt bei 50·(n−1)·n Punkten.</div>${groups}`;
}
function viewWunsch() {
  const w = wish();
  return `<h2 class="h" style="margin-bottom:16px">Auf deiner Wunschliste</h2>${w.length ? `<div class="wl">${w.map(id => SBY[id]).map(s => `<div class="panel"><span class="tag" style="background:#202938">${esc(s.tag)}</span><b style="margin-top:8px">${esc(s.name)}</b><p>${esc(s.d)}</p><button class="btn sm" data-act="heart" data-id="${s.id}"><i class="fa-solid fa-heart" style="color:var(--ac)"></i>Von der Liste nehmen</button></div>`).join('')}</div>` : '<div class="empty">Noch nichts auf der Wunschliste. Setze unten ein Herz bei dem, was du gern spielen würdest.</div>'}
   <h2 class="h" style="margin:34px 0 16px">Bald verfügbar</h2><div class="wl">${SOON.filter(s => !w.includes(s.id)).map(s => `<div class="panel" style="border-style:dashed"><span class="tag" style="background:#202938">${esc(s.tag)}</span><b style="margin-top:8px">${esc(s.name)}</b><p>${esc(s.d)}</p><button class="btn sm" data-act="heart" data-id="${s.id}"><i class="fa-regular fa-heart" style="color:var(--ac)"></i>Auf die Wunschliste</button></div>`).join('') || '<div class="empty">Alles schon auf deiner Wunschliste.</div>'}</div>
   <div class="note" style="margin-top:26px">Die Wunschliste liegt nur auf diesem Gerät. Sie ist eine Merkliste für dich und zeigt, was als Nächstes gebaut werden könnte.</div>`;
}
// ================= Steuerung =================
function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function modal(title, text, value, buttons) { $('m-t').textContent = title; $('m-p').textContent = text; $('m-ta').value = value || ''; $('m-ta').classList.toggle('hidden', value === null); $('m-a').innerHTML = ''; buttons.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn sm ' + (cls || ''); b.textContent = label; b.onclick = fn; $('m-a').appendChild(b); }); $('modal').classList.remove('hidden'); setTimeout(() => { if (value !== null) $('m-ta').focus(); }, 30); }
const closeModal = () => $('modal').classList.add('hidden');
const enc = raw => btoa(unescape(encodeURIComponent(raw)));
function doExport(g) {
  const raw = store.get(g.key); if (raw == null) return; const code = enc(raw);
  modal(`${g.name}: Spielstand sichern`, 'Kopiere diesen Code und bewahre ihn auf. Mit „Einlesen“ stellst du ihn auf diesem oder einem anderen Gerät wieder her.', code, [['Schließen', '', closeModal], ['Kopieren', 'p', () => { $('m-ta').select(); const ok = () => toast('Code kopiert'); try { navigator.clipboard.writeText(code).then(ok, () => { document.execCommand('copy'); ok(); }); } catch (e) { document.execCommand('copy'); ok(); } }]]);
}
function doImport(g) {
  modal(`${g.name}: Spielstand einlesen`, 'Füge hier den Code ein. Der aktuelle Spielstand dieses Spiels wird dabei ersetzt.', '', [['Abbrechen', '', closeModal], ['Einlesen', 'p', () => {
    let raw; try { raw = decodeURIComponent(escape(atob($('m-ta').value.trim()))); if (!g.valid(JSON.parse(raw))) throw 0; } catch (e) { return toast(`Das ist kein gültiger Spielstand für ${g.name}.`); }
    if (store.get(g.key) != null && !confirm('Den vorhandenen Spielstand durch den eingefügten ersetzen?')) return;
    if (!store.set(g.key, raw)) return toast('Speichern nicht möglich (Speicher voll oder gesperrt).'); closeModal(); toast('Spielstand eingelesen'); render();
  }]]);
}
function doReset(g) { if (!confirm(`Spielstand von „${g.name}“ wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return; store.del(g.key); toast('Spielstand gelöscht'); render(); }
function route() { const h = decodeURIComponent(location.hash.slice(1)).split('/'); let v = h[0] || 'entdecken', id = null, tab = 'ueber'; if (GBY[v]) { id = v; v = 'bibliothek'; } else if (v === 'bibliothek') { id = GBY[h[1]] ? h[1] : null; if (['miles', 'stand'].includes(h[2])) tab = h[2]; } if (!['entdecken', 'bibliothek', 'erfolge', 'wunschliste'].includes(v)) v = 'entdecken'; return { v, id, tab }; }
function render() {
  const r = route(), L = load(), P = profile(L); UI.tab = r.tab;
  document.querySelectorAll('[data-v]').forEach(a => { if (a.tagName === 'A') a.classList.toggle('on', a.dataset.v === r.v); });
  $('view').innerHTML = r.v === 'bibliothek' ? viewBibliothek(L, r.id) : r.v === 'erfolge' ? viewErfolge(L, P) : r.v === 'wunschliste' ? viewWunsch() : viewEntdecken(L, P);
  $('av').textContent = (P.name.trim()[0] || 'S').toUpperCase(); $('nm').textContent = P.name; $('lv').textContent = `Level ${P.lvl} · ${P.xp.toLocaleString('de-DE')} XP`; $('lvb').style.width = P.p + '%';
  document.title = (r.v === 'bibliothek' && r.id ? GBY[r.id].name + ' · ' : '') + 'Game Center';
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, id = b.dataset.id;
  if (a === 'heart') { const w = wish(), i = w.indexOf(id); if (i >= 0) w.splice(i, 1); else w.push(id); setWish(w); render(); }
  else if (a === 'filter') { UI.filter = b.dataset.v; render(); } else if (a === 'erfs') { UI.erfS = b.dataset.v; render(); }
  else if (a === 'export') doExport(GBY[id]); else if (a === 'import') doImport(GBY[id]); else if (a === 'reset') doReset(GBY[id]);
});
document.addEventListener('change', e => { if (e.target.id === 'sort') { UI.sort = e.target.value; render(); } else if (e.target.id === 'erfG') { UI.erfG = e.target.value; render(); } });
const onQ = v => { UI.q = v; if (route().v !== 'entdecken') { location.hash = '#entdecken'; return; } const g = $('grid'); if (g) g.innerHTML = cardsHtml(load()); };
$('q').addEventListener('input', e => { onQ(e.target.value); const q2 = $('q2'); if (q2) q2.value = e.target.value; });
document.addEventListener('input', e => { if (e.target.id === 'q2') { UI.q = e.target.value; $('q').value = e.target.value; const g = $('grid'); if (g) g.innerHTML = cardsHtml(load()); } });
$('me').addEventListener('click', () => { const n = prompt('Wie sollen wir dich nennen? (höchstens 24 Zeichen)', store.get('gc-name') || 'Spieler'); if (n && n.trim()) { store.set('gc-name', n.trim().slice(0, 24)); render(); } });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); }); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); }); window.addEventListener('storage', () => render());
render();
window.GC = { GAMES, SOON, load, profile, route, render, UI, fmtN, dur, ago, ballonInfo, idleInfo, wish, setWish };
</script>
</body>
</html>
