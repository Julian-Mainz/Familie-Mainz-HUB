<script>
        initAuthGuard(user => {
            if (!user) return;
            renderDrawer();
            checkSystemHealth();
            loadFirestoreStats();
        });

        function checkSystemHealth() {
            // Netzwerk
            const netEl = document.getElementById('status-net');
            if (navigator.onLine) {
                netEl.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Online (Verbunden)';
            } else {
                netEl.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span> Getrennt (Offline)';
                netEl.className = 'text-xl font-bold text-rose-400 mt-2 flex items-center gap-2';
            }

            // Firestore Test
            db.collection('system_logs').limit(1).get().then(() => {
                document.getElementById('status-db').innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Online & Reaktionsbereit';
            }).catch(err => {
                const dbEl = document.getElementById('status-db');
                dbEl.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span> Eingeschränkt';
            });
        }

        async function loadFirestoreStats() {
            if (!currentUser) return;

            // 1. Dokumenten-Anzahl sicher über den eigenen Owner-Filter laden (um Sicherheitsregeln nicht zu verletzen)
            const collections = [
                { name: 'worktime', el: 'count-worktime', filtered: true },
                { name: 'finance_transactions', el: 'count-finances', filtered: true },
                { name: 'vault', el: 'count-vault', filtered: true },
                { name: 'system_logs', el: 'count-logs', filtered: false }
            ];

            for (const col of collections) {
                try {
                    let query = db.collection(col.name);
                    if (col.filtered) {
                        query = query.where('owner', '==', currentUser.email);
                    }
                    const snap = await query.get();
                    document.getElementById(col.el).innerText = snap.size + ' Dokumente (deine)';
                } catch (e) {
                    document.getElementById(col.el).innerText = 'Geschützt / Leer';
                }
            }

            // 2. Heutigen Verbrauch (Reads / Writes) simulieren bzw. aus LocalStorage / Session zählen
            calculateDailyUsage();
        }

        function calculateDailyUsage() {
            const todayKey = 'firebase_usage_' + new Date().toISOString().slice(0, 10);
            let usage = JSON.parse(localStorage.getItem(todayKey) || '{"reads": 12, "writes": 2}');

            // Anzeige aktualisieren (Falls du ein UI-Element dafür einbauen möchtest)
            console.log("Heutiger Firebase-Verbrauch:", usage);
        }
    </script>
</body>
</html>
