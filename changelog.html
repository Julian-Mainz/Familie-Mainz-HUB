    <style>
    .cl{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}@media(max-width:900px){.cl{grid-template-columns:1fr}.cl-nav{display:none}}
    .cl-nav{position:sticky;top:18px;padding:14px;max-height:calc(100vh - 36px);overflow:auto}
    .cl-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:13.5px}.cl-nav a:hover,.cl-nav a.on{background:rgba(var(--mr),.12);color:#fff}
    .cl-nav a small{margin-left:auto;font-size:11px;color:#94a3b8}.cl-nav .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);flex:none}.cl-nav a.new .dot{background:var(--m);box-shadow:0 0 8px var(--m)}
    .cl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.cl-tools .ux-in{max-width:280px}
    .cl-day{margin-bottom:22px;scroll-margin-top:16px}.cl-dh{display:flex;align-items:center;gap:12px;margin:0 4px 10px}.cl-dh h2{margin:0;font-size:19px;font-weight:800;color:#f8fafc}.cl-dh small{color:#94a3b8;font-size:13px}
    .cl-new{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:7px;background:rgba(var(--mr),.18);color:var(--m)}
    .cl-sec{display:flex;gap:16px;padding:18px 20px;margin-bottom:10px}.cl-ic{width:42px;height:42px;min-width:42px;border-radius:13px;display:grid;place-items:center;font-size:17px;background:rgba(var(--cr),.14);color:var(--c)}
    .cl-b{min-width:0;flex:1}.cl-b h3{margin:2px 0 8px;font-size:16px;font-weight:700;color:#f1f5f9}.cl-b ul{margin:0;padding-left:1.15rem}.cl-b li{font-size:14px;line-height:1.65;color:#cbd5e1;margin:2px 0}.cl-b p{font-size:14px;color:#cbd5e1;margin:0 0 6px;line-height:1.6}
    .cl-b code{font-size:12.5px;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px}.cl-b mark{background:rgba(var(--mr),.3);color:#fff;border-radius:3px;padding:0 2px}
    .cl-adm{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(192,132,252,.15);color:#d8b4fe;margin-left:8px;vertical-align:middle}
    @media(max-width:560px){.cl-sec{padding:14px;gap:12px}.cl-ic{width:36px;height:36px;min-width:36px;font-size:15px}}
    </style>
</head>
<body class="ux">
<main class="ux-page" style="--m:#a78bfa;--m2:#7c3aed;--mr:167,139,250">
    <div class="ux-top">
        <div class="ux-ico"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div><h1 class="ux-h1">Changelog</h1><div class="ux-sub" id="ux-sub">Was ist neu im J.Mainz Dashboard</div></div>
    </div>
    <div class="cl">
        <nav class="ux-card cl-nav" id="cl-nav" aria-label="Versionen"></nav>
        <div>
            <div class="cl-tools"><input id="cl-q" class="ux-in" placeholder="Suchen, z. B. Rechnungen" aria-label="Changelog durchsuchen"><div id="cl-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
            <div id="cl-list"><div class="ux-card ux-empty"><i class="fa-solid fa-clock-rotate-left"></i>Lade Änderungen …</div></div>
        </div>
    </div>
</main>
<script src="/js/pages/changelog.js?v=55bbc080" defer></script>
