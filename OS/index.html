    <link rel="prefetch" as="script" href="officekit.js?v=b7e7eb8c" data-lazy>

    <script src="social.js?v=d750e7f4" defer></script>

    <script src="more.js?v=e35b151a" defer></script>
    <script src="tools.js?v=955fc18e" defer></script>
    <script src="season.js?v=1a6bd43b" defer></script>

    <script src="os.js?v=48869fb9" defer></script>
</head>
<body>
    <!-- Hintergrund -->
    <div id="wall" aria-hidden="true"><canvas id="stars"></canvas><div class="wall-img"></div></div>

    <!-- Startbildschirm beim Laden -->
    <div id="boot" role="status" aria-live="polite">
        <div class="boot-logo"><span></span><span></span><span></span><span></span></div>
        <div class="boot-name">J.Mainz <b>OS</b></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-msg" id="boot-msg">Wird gestartet …</div>
    </div>

    <!-- Desktop mit Symbolen -->
    <main id="desk" aria-label="Desktop">
        <div id="icons" role="listbox" aria-label="Desktop-Symbole"></div>
        <div id="widgets" aria-label="Widgets"></div>
        <div id="select-box" hidden></div>
    </main>

    <!-- Fenster -->
    <div id="wins"></div>
    <div id="snap" hidden></div>

    <!-- Startmenü -->
    <section id="start" class="pop" hidden aria-label="Startmenü">
        <div class="st-search"><i class="fa-solid fa-magnifying-glass"></i><input id="st-q" type="search" placeholder="Apps durchsuchen …" autocomplete="off" aria-label="Apps durchsuchen"></div>
        <div class="st-body">
            <div id="st-res"></div>
            <div class="st-head st-allh"><span>Alle Apps</span><small id="st-count"></small><div class="seg st-view" role="group" aria-label="Ansicht"><button type="button" data-sv="list" title="Liste" aria-label="Liste"><i class="fa-solid fa-list"></i></button><button type="button" data-sv="grid" title="Raster" aria-label="Raster"><i class="fa-solid fa-table-cells-large"></i></button></div></div>
            <div id="st-all"></div>
            <div id="st-empty" class="st-empty" hidden><i class="fa-solid fa-magnifying-glass"></i>Keine App gefunden</div>
        </div>
        <div class="st-foot">
            <div class="st-user"><span class="st-av" id="st-av"></span><span><b id="st-name">…</b><small id="st-role"></small></span></div>
            <button type="button" class="st-btn" data-act="lock" title="Sperren (Alt+L)"><i class="fa-solid fa-lock"></i></button>
            <button type="button" class="st-btn" data-act="settings" title="Einstellungen"><i class="fa-solid fa-gear"></i></button>
            <a class="st-btn" href="/menu.html" title="Zum normalen Dashboard"><i class="fa-solid fa-border-all"></i></a>
            <button type="button" class="st-btn" data-act="logout" title="Abmelden"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </section>

    <!-- Kalender-Flyout an der Uhr -->
    <section id="cal" class="pop" hidden aria-label="Kalender">
        <div class="cal-now"><b id="cal-time"></b><span id="cal-date"></span></div>
        <div class="cal-nav"><button type="button" data-m="-1" aria-label="Vorheriger Monat"><i class="fa-solid fa-chevron-left"></i></button><b id="cal-title"></b><button type="button" data-m="1" aria-label="Nächster Monat"><i class="fa-solid fa-chevron-right"></i></button></div>
        <div id="cal-grid" class="cal-grid"></div>
    </section>

    <!-- Widgets hinzufügen -->
    <section id="wg-pick" class="pop" hidden aria-label="Widgets hinzufügen"></section>

    <!-- Mitteilungen -->
    <section id="nc" class="pop" hidden aria-label="Mitteilungen"></section>
    <div id="toasts" aria-live="polite"></div>
    <div id="bubbles" aria-label="Chat-Blasen"></div>
    <section id="chatbox" hidden aria-label="Chat"></section>

    <!-- Schnellstart und Zwischenablage -->
    <section id="qs" class="pop" hidden aria-label="Schnellstart"></section>
    <section id="clip" class="pop" hidden aria-label="Zwischenablage"></section>

    <!-- Kontextmenü -->
    <div id="ctx" class="pop" hidden role="menu"></div>

    <!-- Taskleiste -->
    <footer id="bar" aria-label="Taskleiste">
        <button type="button" id="start-btn" aria-label="Start" aria-expanded="false" aria-controls="start"><span class="logo"><span></span><span></span><span></span><span></span></span></button>
        <button type="button" id="bar-search" aria-label="Suchen"><i class="fa-solid fa-magnifying-glass"></i><span>Suchen</span></button>
        <button type="button" id="desk-chip" hidden title="Desktop wechseln (Alt+Bild auf/ab)"></button>
        <button type="button" id="bar-tv" aria-label="Fensterübersicht" title="Fensterübersicht (Alt+Q)"><i class="fa-solid fa-clone"></i></button>
        <button type="button" id="bar-wg" aria-label="Widgets hinzufügen" title="Widgets hinzufügen"><i class="fa-solid fa-table-cells-large"></i></button>
        <div id="tasks" role="toolbar" aria-label="Geöffnete Apps"></div>
        <div id="tray">
            <div id="mp" hidden role="group" aria-label="Musik"></div>
            <button type="button" class="tray-i" id="net" title="Schnellstart (Alt+A)" aria-label="Schnellstart" aria-expanded="false" aria-controls="qs"><i class="fa-solid fa-wifi"></i></button>
            <button type="button" class="tray-i" id="bell" aria-label="Mitteilungen" aria-expanded="false" aria-controls="nc"><i class="fa-solid fa-bell"></i><b id="bell-n" hidden></b></button>
            <button type="button" id="clock" aria-label="Uhr und Kalender" aria-expanded="false" aria-controls="cal"><b id="clk-t">--:--</b><small id="clk-d"></small></button>
            <button type="button" id="show-desk" title="Desktop anzeigen" aria-label="Desktop anzeigen"></button>
        </div>
    </footer>
</body>
</html>
