<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.Mainz Dashboard – Secure Login</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#080c14">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-init.js"></script>

    <style>
        body { 
            background-color: #030712; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* Dezenter Hintergrund-Glow */
        .bg-glow {
            background: radial-gradient(circle at 50% 30%, rgba(79, 70, 229, 0.12) 0%, rgba(3, 7, 18, 0) 70%);
        }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
    </style>
    <style type="text/tailwindcss">
        .inp { @apply w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 bg-glow bg-no-repeat bg-center">

    <!-- Top Status -->
    <div class="max-w-md w-full mx-auto flex justify-between items-center pt-4">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-xs">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="font-bold text-sm tracking-wide text-slate-200">J.Mainz Portal</span>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/60 border border-slate-800/80 px-3 py-1 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[11px] font-medium text-slate-300">Secure Cloud</span>
        </div>
    </div>

    <!-- Main Centered Box -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Dezenter Leuchtstreifen oben am Container -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent opacity-70"></div>

            <div class="text-center mb-8">
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-100">Willkommen zurück</h1>
                <p class="text-xs text-slate-400 mt-1.5">Bitte melden Sie sich an, um auf das Dashboard zuzugreifen.</p>
            </div>

            <div id="auth-alert" class="hidden mb-4 p-3 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i><span id="auth-alert-text"></span>
            </div>

            <!-- Login Formular -->
            <form id="form-login" onsubmit="handleSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">E-Mail</label>
                    <input type="email" id="login-email" required placeholder="name@julian-mainz.de" class="inp">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Passwort</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="inp">
                </div>
                <div class="pt-2 space-y-3">
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/25 text-sm transition-all">Anmelden</button>
                    <button type="button" onclick="showRegisterView(true)" class="w-full bg-slate-900/60 hover:bg-slate-900 text-slate-300 font-medium py-3 rounded-2xl border border-slate-800 text-xs transition-all">Neues Konto beantragen</button>
                </div>
            </form>

            <!-- Registrierungs Formular -->
            <form id="form-register" onsubmit="handleSignUp(event)" class="space-y-3.5 hidden">
                <div>
                    <h2 class="text-sm font-bold text-slate-100 mb-1">Konto registrieren</h2>
                    <p class="text-[11px] text-slate-400">Das Konto muss nach Erstellung freigegeben werden.</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-firstname" required placeholder="Vorname" class="inp text-xs py-2.5">
                    <input type="text" id="reg-lastname" required placeholder="Nachname" class="inp text-xs py-2.5">
                </div>
                <input type="email" id="reg-email" required placeholder="E-Mail" class="inp text-xs py-2.5">
                <input type="password" id="reg-password" required minlength="6" placeholder="Passwort (min. 6 Zeichen)" class="inp text-xs py-2.5">
                <button type="submit" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-2xl text-xs transition-all shadow-lg shadow-emerald-600/20">Konto anlegen</button>
                <button type="button" onclick="showRegisterView(false)" class="w-full text-xs text-slate-400 hover:text-slate-200 py-1 text-center">&larr; Zurück zum Login</button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-600 pb-2">
        J.Mainz Dashboard &bull; Cloud Security
    </footer>

    <script>
        const $ = id => document.getElementById(id);
        const TS = () => firebase.firestore.FieldValue.serverTimestamp();

        // Wenn bereits eingeloggt, direkt ins Menü weiterleiten
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = '/menu.html';
            }
        });

        function showAuthAlert(msg) {
            $('auth-alert-text').innerText = msg;
            $('auth-alert').classList.remove('hidden');
        }

        function showRegisterView(show) {
            $('auth-alert').classList.add('hidden');
            $('form-login').classList.toggle('hidden', show);
            $('form-register').classList.toggle('hidden', !show);
        }

        async function handleSignIn(e) {
            e.preventDefault();
            $('auth-alert').classList.add('hidden');
            const email = $('login-email').value.trim(), password = $('login-password').value;
            const btn = $('btn-login');
            btn.disabled = true; btn.innerText = 'Wird angemeldet...';
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (err) {
                showAuthAlert('Anmeldung fehlgeschlagen. Bitte Zugangsdaten prüfen.');
                btn.disabled = false; btn.innerText = 'Anmelden';
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            $('auth-alert').classList.add('hidden');
            const firstName = $('reg-firstname').value.trim(), lastName = $('reg-lastname').value.trim();
            const email = $('reg-email').value.trim(), password = $('reg-password').value;
            const btn = $('btn-register');
            btn.disabled = true; btn.innerText = 'Erstelle Konto...';
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).set({
                    firstName, lastName, displayName: `${firstName} ${lastName}`, email,
                    role: 'user', status: 'pending',
                    permissions: { kalender: true, zeit: true, finanzen: true, tresor: true, admin: false },
                    userPrefs: { notifyWork: true, notifyEvents: true },
                    createdAt: TS()
                });
                await auth.signOut();
                alert('Registrierung erfolgreich! Ein Administrator muss Ihr Konto freigeben.');
                showRegisterView(false);
            } catch (err) {
                showAuthAlert('Registrierung fehlgeschlagen: ' + err.message);
            } finally {
                btn.disabled = false; btn.innerText = 'Konto anlegen';
            }
        }
    </script>
</body>
</html>
