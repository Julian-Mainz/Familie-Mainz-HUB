<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familie Mainz - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 relative overflow-x-hidden">

    <!-- OBERE ÜBERSCHRIFT (Zentriert) -->
    <header class="text-center pt-4 md:pt-8">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-slate-100 font-sans">
            Willkommen im Dashboard der Familie Mainz
        </h1>
        <p class="text-xs text-indigo-400 mt-2 tracking-wider uppercase font-semibold">Zentraler Familien-Hub</p>
    </header>

    <!-- HAUPTBEREICH: Login-Karte (Mitte) & Status-Karte (Rechts) -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center lg:justify-between w-full max-w-6xl mx-auto gap-8 my-8 relative">

        <!-- Platzhalter links (damit die Box in der Mitte optisch genau im Zentrum bleibt) -->
        <div class="hidden lg:block w-72 pointer-events-none"></div>

        <!-- MITTIGE KARTE: LOGIN & REGISTRIERUNG -->
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 transition-all">
            
            <!-- Fehlermeldung Box -->
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="auth-alert-text"></span>
            </div>

            <!-- FORMULAR: ANMELDUNG -->
            <form id="form-login" onsubmit="handleSignIn(event)" class="space-y-4">
                <div class="text-center mb-6">
                    <h2 class="text-lg font-semibold text-slate-200">Anmelden</h2>
                    <p class="text-xs text-slate-400">Gib deine Zugangsdaten ein</p>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">E-Mail</label>
                    <input type="email" id="login-email" required placeholder="name@familie-mainz.de" 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Passwort</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>

                <div class="pt-2 space-y-3">
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-2xl transition-all shadow-lg shadow-indigo-600/20 text-sm">
                        Anmelden
                    </button>

                    <button type="button" onclick="showRegisterView(true)" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-3 rounded-2xl transition-all border border-slate-700/60 text-sm">
                        Registrieren
                    </button>
                </div>
            </form>

            <!-- FORMULAR: REGISTRIERUNG (Umschaltbar) -->
            <form id="form-register" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
                <div class="text-center mb-6">
                    <h2 class="text-lg font-semibold text-indigo-400">Neuen Benutzer anlegen</h2>
                    <p class="text-xs text-slate-400">Erstelle deinen persönlichen Zugang</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Vorname</label>
                        <input type="text" id="reg-firstname" required placeholder="Julian" 
                            class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Nachname</label>
                        <input type="text" id="reg-lastname" required placeholder="Mainz" 
                            class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">E-Mail</label>
                    <input type="email" id="reg-email" required placeholder="name@familie-mainz.de" 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Passwort (min. 6 Zeichen)</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="pt-2 space-y-3">
                    <button type="submit" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-2xl transition-all shadow-lg shadow-emerald-600/20 text-sm">
                        Benutzer jetzt erstellen
                    </button>

                    <button type="button" onclick="showRegisterView(false)" class="w-full text-xs text-slate-400 hover:text-slate-200 py-1 transition-colors text-center">
                        &larr; Zurück zum Login
                    </button>
                </div>
            </form>
        </div>

        <!-- RECHTE STATUS-KARTE -->
        <aside class="w-full lg:w-72 bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-6">
            <div class="border-b border-slate-800 pb-3">
                <h3 class="font-bold text-sm text-slate-200 tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-server text-indigo-400"></i>
                    Status des Systems
                </h3>
            </div>

            <div class="space-y-4">
                <!-- Status Cloud -->
                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-950/40 border border-slate-800/50">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-cloud text-slate-400 text-sm"></i>
                        <span class="text-xs text-slate-300 font-medium">Cloud</span>
                    </div>
                    <div id="status-cloud" class="flex items-center space-x-1.5 text-emerald-400 text-xs font-semibold">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Online</span>
                    </div>
                </div>

                <!-- Status Login System -->
                <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-950/40 border border-slate-800/50">
                    <div class="flex items-center space-x-3">
                        <i class="fa-solid fa-shield-halved text-slate-400 text-sm"></i>
                        <span class="text-xs text-slate-300 font-medium">Log in System</span>
                    </div>
                    <div id="status-auth" class="flex items-center space-x-1.5 text-emerald-400 text-xs font-semibold">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>

            <div class="text-[11px] text-slate-500 text-center pt-2">
                Firebase Firestore & Auth aktiv
            </div>
        </aside>

    </main>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-slate-600 pb-2">
        Familie Mainz Hub &bull; Sichere Familienplattform
    </footer>

    <!-- LOGIK & FIREBASE INTEGRATION -->
    <script>
        // 1. Firebase Konfiguration
        const firebaseConfig = {
            apiKey: "AIzaSyCfKWWHQ17-ujYGJcHw6efFBESArA8uY0Q",
            authDomain: "familie-mainz-netzwerk.firebaseapp.com",
            projectId: "familie-mainz-netzwerk",
            storageBucket: "familie-mainz-netzwerk.firebasestorage.app",
            messagingSenderId: "361922663455",
            appId: "1:361922663455:web:ed3eb8d34103ce89be312a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Umschalten zwischen Login und Registrierung
        function showRegisterView(show) {
            hideAlert();
            if (show) {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
            } else {
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('form-login').classList.remove('hidden');
            }
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('auth-alert');
            const alertText = document.getElementById('auth-alert-text');
            alertText.innerText = msg;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('auth-alert').classList.add('hidden');
        }

        // 2. Anmelden
        async function handleSignIn(e) {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerText = 'Wird angemeldet...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Wenn erfolgreich eingeloggt, leitet onAuthStateChanged weiter
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Anmelden';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    showAlert('E-Mail oder Passwort ist nicht korrekt.');
                } else {
                    showAlert(err.message);
                }
            }
        }

        // 3. Registrieren (Neuer Benutzer mit Name, E-Mail & Firestore-Eintrag)
        async function handleSignUp(e) {
            e.preventDefault();
            hideAlert();
            const firstName = document.getElementById('reg-firstname').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('btn-register');

            btn.disabled = true;
            btn.innerText = 'Erstelle Benutzer...';

            try {
                // In Firebase Auth anlegen
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                
                // Rolle bestimmen
                const isAdmin = email.toLowerCase().includes('admin') || email.toLowerCase().includes('julian');
                const role = isAdmin ? 'admin' : 'user';

                // Profil & Name in Cloud Firestore speichern
                await db.collection('users').doc(userCred.user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    displayName: `${firstName} ${lastName}`,
                    email: email,
                    role: role,
                    permissions: {
                        finanzen: true,
                        kalender: true,
                        admin: isAdmin
                    },
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'Benutzer jetzt erstellen';
                if (err.code === 'auth/email-already-in-use') {
                    showAlert('Diese E-Mail-Adresse ist bereits vergeben.');
                } else if (err.code === 'auth/weak-password') {
                    showAlert('Das Passwort muss mindestens 6 Zeichen lang sein.');
                } else {
                    showAlert(err.message);
                }
            }
        }

        // 4. Status-Listener: Erkennt Login sofort
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('Angemeldet als:', user.email);
                // Hier bauen wir im nächsten Schritt die Weiterleitung zur nächsten Dashboard-Ansicht ein
                showAlert(`Erfolgreich angemeldet als ${user.email}!`);
            }
        });
    </script>
</body>
</html>
