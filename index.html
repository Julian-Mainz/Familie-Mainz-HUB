<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.Mainz Datenbank - Finanzen</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #121824;
      --card-border: #1d2636;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; min-height: 100vh; }

    /* Sidebar */
    aside { width: 220px; background-color: #0d111a; border-right: 1px solid var(--card-border); padding: 20px 15px; }
    aside h2 { font-size: 1rem; color: var(--text-muted); margin-bottom: 25px; padding-left: 10px; }
    aside nav a { display: block; color: var(--text-muted); text-decoration: none; padding: 10px 12px; border-radius: 6px; margin-bottom: 5px; font-size: 0.9rem; }
    aside nav a.active, aside nav a:hover { background-color: #1e293b; color: #fff; }

    /* Main Container */
    main { flex: 1; padding: 25px 30px; overflow-y: auto; }

    /* Header & Action Bar */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    
    select, input[type="month"] { background-color: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; }

    /* Buttons */
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 0.85rem; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn-blue { background-color: #3b82f6; color: white; }
    .btn-blue:hover { background-color: #2563eb; }
    .btn-green { background-color: #10b981; color: white; }
    .btn-green:hover { background-color: #059669; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn-danger:hover { background-color: #dc2626; }

    /* Key Metrics Grid */
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
    .metric-card { background-color: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 8px; }
    .metric-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .metric-value { font-size: 1.5rem; font-weight: 700; }
    .metric-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }

    /* Content Cards / Tables */
    .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 15px; }

    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th { color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--card-border); padding: 10px; }
    td { padding: 12px 10px; border-bottom: 1px solid #1a2332; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .badge-einnahme { background-color: rgba(16, 185, 129, 0.15); color: var(--green); }
    .badge-ausgabe { background-color: rgba(239, 68, 68, 0.15); color: var(--red); }

    .val-green { color: var(--green); }
    .val-red { color: var(--red); }

    .btn-delete { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .btn-delete:hover { color: var(--red); }
  </style>
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside>
    <h2>J.Mainz Datenbank</h2>
    <nav>
      <a href="#">Start Menü</a>
      <a href="#" class="active">Finanzen</a>
      <a href="#">Berechtigungen</a>
    </nav>
  </aside>

  <!-- Hauptinhaltsbereich -->
  <main>
    <div class="header-bar">
      <div>
        <label for="monthPicker" style="font-size: 0.8rem; color: var(--text-muted);">Abrechnungsmonat auswählen:</label>
        <input type="month" id="monthPicker" onchange="renderApp()">
      </div>
      <div class="header-controls">
        <!-- Sparkassen CSV Import -->
        <label for="sparkasseCsvInput" class="btn btn-blue">
          📥 Sparkassen-CSV importieren
        </label>
        <input type="file" id="sparkasseCsvInput" accept=".csv" style="display: none;" onchange="importSparkasseCSV(event)">

        <!-- Admin Datenbank leeren -->
        <button class="btn btn-danger" onclick="clearDatabase()">
          ⚠️ Admin: Datenbank leeren
        </button>
      </div>
    </div>

    <!-- Kennzahlen / Dashboard -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">Einnahmen gesamt</div>
        <div class="metric-value val-green" id="einnahmenVal">0,00 €</div>
        <div class="metric-sub" id="einnahmenCount">0 Buchungen</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Ausgaben gesamt</div>
        <div class="metric-value val-red" id="ausgabenVal">0,00 €</div>
        <div class="metric-sub" id="ausgabenCount">0 Buchungen</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Netto-Cashflow</div>
        <div class="metric-value" id="cashflowVal">0,00 €</div>
        <div class="metric-sub">Differenz E - A</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Sparquote</div>
        <div class="metric-value" id="sparquoteVal" style="color: #38bdf8;">0.0 %</div>
        <div class="metric-sub">Überschuss / Sparpotenzial</div>
      </div>
    </div>

    <!-- Buchungen Tabelle -->
    <div class="card">
      <div class="card-title">Buchungen im gewählten Zeitraum</div>
      <table>
        <thead>
          <tr>
            <th>DATUM</th>
            <th>TYP</th>
            <th>KATEGORIE</th>
            <th>BESCHREIBUNG</th>
            <th style="text-align: right;">BETRAG</th>
            <th style="text-align: center;">AKTIONEN</th>
          </tr>
        </thead>
        <tbody id="buchungenTbody">
          <!-- Zeilen werden dynamisch erzeugt -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // Initialisierung beim Laden
    document.addEventListener("DOMContentLoaded", () => {
      // Standardmäßig aktuellen Monat wählen (YYYY-MM)
      const now = new Date();
      const currentMonth = now.toISOString().slice(0, 7);
      document.getElementById("monthPicker").value = currentMonth;
      
      renderApp();
    });

    // 1. Sparkassen-CSV Import
    function importSparkasseCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      
      // Sparkassen nutzen meist ISO-8859-1 (ANSI) Zeichencodierung
      reader.readAsText(file, "ISO-8859-1");

      reader.onload = function(e) {
        const text = e.target.result;
        const lines = text.split("\n");
        let importedCount = 0;

        let buchungen = JSON.parse(localStorage.getItem("buchungen")) || [];

        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          // CSV Zeile trennen (Sparkasse verwendet Semikolon ';')
          const cols = line.split(";").map(c => c.replace(/^"|"$/g, '').trim());
          if (cols.length < 8) continue;

          // Standard-Spaltenzuordnung der Sparkasse
          const rawDatum = cols[1];         // Buchungstag (DD.MM.YY oder DD.MM.YYYY)
          const empfaenger = cols[11] || cols[4] || "Sparkassen-Import"; // Empfänger / Verwendungszweck
          const rawBetrag = cols[14] || cols[8]; // Betrag (z.B. -780,00 oder 2850,00)

          if (!rawDatum || !rawBetrag) continue;

          // Datum ins ISO-Format YYYY-MM-DD wandeln
          const dParts = rawDatum.split(".");
          if (dParts.length !== 3) continue;
          let year = dParts[2].length === 2 ? "20" + dParts[2] : dParts[2];
          const formattedDate = `${year}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;

          // Betrag in Fließkommazahl konvertieren
          const betragNum = parseFloat(rawBetrag.replace(/\./g, "").replace(",", "."));
          if (isNaN(betragNum)) continue;

          const typ = betragNum >= 0 ? "Einnahme" : "Ausgabe";
          const absBetrag = Math.abs(betragNum);

          // Automatische Kategorisierung
          let kategorie = "Sonstiges";
          const desc = empfaenger.toLowerCase();
          if (desc.includes("gehalt") || desc.includes("lohn") || desc.includes("bezüge")) kategorie = "Gehalt";
          else if (desc.includes("miete") || desc.includes("wohnen")) kategorie = "Miete / Wohnen";
          else if (desc.includes("rewe") || desc.includes("aldi") || desc.includes("lidl") || desc.includes("supermarkt")) kategorie = "Lebensmittel & Haushalt";

          buchungen.push({
            id: Date.now() + Math.random(),
            datum: formattedDate,
            typ: typ,
            kategorie: kategorie,
            beschreibung: empfaenger,
            betrag: absBetrag
          });

          importedCount++;
        }

        localStorage.setItem("buchungen", JSON.stringify(buchungen));
        alert(`${importedCount} Buchungen aus der Sparkassen-CSV erfolgreich importiert!`);
        renderApp();
      };
    }

    // 2. Admin: Datenbank leeren
    function clearDatabase() {
      if (confirm("Möchtest du wirklich ALLE Daten aus der Datenbank löschen?")) {
        if (confirm("ACHTUNG: Dieser Vorgang lässt sich nicht rückgängig machen! Wirklich leeren?")) {
          localStorage.removeItem("buchungen");
          alert("Datenbank wurde vollständig geleert.");
          renderApp();
        }
      }
    }

    // Einzelne Buchung löschen
    function deleteBuchung(id) {
      let buchungen = JSON.parse(localStorage.getItem("buchungen")) || [];
      buchungen = buchungen.filter(b => b.id !== id);
      localStorage.setItem("buchungen", JSON.stringify(buchungen));
      renderApp();
    }

    // 3. UI Rendern & Berechnungen
    function renderApp() {
      const selectedMonth = document.getElementById("monthPicker").value; // Format: YYYY-MM
      const buchungen = JSON.parse(localStorage.getItem("buchungen")) || [];

      // Filtern nach ausgewähltem Monat
      const gefiltert = buchungen.filter(b => b.datum && b.datum.startsWith(selectedMonth));

      let einnahmenSumme = 0;
      let einnahmenCount = 0;
      let ausgabenSumme = 0;
      let ausgabenCount = 0;

      const tbody = document.getElementById("buchungenTbody");
      tbody.innerHTML = "";

      gefiltert.sort((a, b) => new Date(a.datum) - new Date(b.datum)).forEach(b => {
        if (b.typ === "Einnahme") {
          einnahmenSumme += b.betrag;
          einnahmenCount++;
        } else {
          ausgabenSumme += b.betrag;
          ausgabenCount++;
        }

        const tr = document.createElement("tr");
        const formattedDate = b.datum.split("-").reverse().join("."); // DD.MM.YYYY

        tr.innerHTML = `
          <td>${formattedDate}</td>
          <td><span class="badge ${b.typ === 'Einnahme' ? 'badge-einnahme' : 'badge-ausgabe'}">${b.typ === 'Einnahme' ? '+ Einnahme' : '- Ausgabe'}</span></td>
          <td>${b.kategorie}</td>
          <td>${b.beschreibung}</td>
          <td style="text-align: right;" class="${b.typ === 'Einnahme' ? 'val-green' : 'val-red'}">
            ${b.typ === 'Einnahme' ? '+' : '-'}${b.betrag.toLocaleString('de-DE', {minimumFractionDigits: 2})} €
          </td>
          <td style="text-align: center;">
            <button class="btn-delete" onclick="deleteBuchung(${b.id})">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Kennzahlen updaten
      const cashflow = einnahmenSumme - ausgabenSumme;
      const sparquote = einnahmenSumme > 0 ? ((cashflow / einnahmenSumme) * 100).toFixed(1) : "0.0";

      document.getElementById("einnahmenVal").innerText = `${einnahmenSumme.toLocaleString('de-DE', {minimumFractionDigits: 2})} €`;
      document.getElementById("einnahmenCount").innerText = `${einnahmenCount} Buchung${einnahmenCount !== 1 ? 'en' : ''}`;

      document.getElementById("ausgabenVal").innerText = `${ausgabenSumme.toLocaleString('de-DE', {minimumFractionDigits: 2})} €`;
      document.getElementById("ausgabenCount").innerText = `${ausgabenCount} Buchung${ausgabenCount !== 1 ? 'en' : ''}`;

      const cashflowEl = document.getElementById("cashflowVal");
      cashflowEl.innerText = `${cashflow.toLocaleString('de-DE', {minimumFractionDigits: 2})} €`;
      cashflowEl.className = `metric-value ${cashflow >= 0 ? 'val-green' : 'val-red'}`;

      document.getElementById("sparquoteVal").innerText = `${sparquote} %`;
    }
  </script>
</body>
</html>
