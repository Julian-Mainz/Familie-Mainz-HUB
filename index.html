<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – J.Mainz Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#080c14">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-init.js"></script>

    <style>
        body { background-color: #080c14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
    <style type="text/tailwindcss">
        .inp { @apply w-full bg-slate-800/80 border border-slate-700 rounded-2xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 bg-[#080c14]">

    <div class="absolute top-6 right-6 flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-2xl shadow-xl">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-medium text-slate-300">Cloud Auth Secured</span>
        </div>
    </div>

    <header class="text-center pt-12">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-slate-100">Willkommen im J.Mainz Dashboard</h1>
        <p class="text-xs text-slate-400 mt-2">Bitte melden Sie sich an, um fortzufahren.</p>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 rounded-3xl p-8 shadow-2xl">
            <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i><span id="auth-alert-text"></span>
            </div>

            <!-- Login Formular -->
            <form id="form-login" onsubmit="handleSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">E-Mail</label>
                    <input type="email" id="login-email" required placeholder="name@julian-mainz.de" class="inp">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1 ml-1">Passwort</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="inp">
                </div>
                <div class="pt-3 space-y-3">
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-2xl shadow-lg shadow-indigo-600/20 text-sm transition-all">Anmelden</button>
                    <button type="button" onclick="showRegisterView(true)" class="w-full bg-slate-800/60 hover:bg-slate-800 text-slate-300 font-medium py-3 rounded-2xl border border-slate-700/60 text-sm transition-all">Registrieren</button>
                </div>
            </form>

            <!-- Registrierungs Formular -->
            <form id="form-register" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="reg-firstname" required placeholder="Vorname" class="inp">
                    <input type="text" id="reg-lastname" required placeholder="Nachname" class="inp">
                </div>
                <input type="email" id="reg-email" required placeholder="E-Mail" class="inp">
                <input type="password" id="reg-password" required minlength="6" placeholder="Passwort (min. 6 Zeichen)" class="inp">
                <button type="submit" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-2xl text-sm transition-all">Benutzer jetzt erstellen</button>
                <button type="button" onclick="showRegisterView(false)" class="w-full text-xs text-slate-400 hover:text-slate-200 py-1 text-center">&larr; Zurück zum Login</button>
            </form>
        </div>
    </main>

    <footer class="text-center text-xs text-slate-600 pb-2">J.Mainz Dashboard &bull; Cloud Security</footer>

    <script>
        const $ = id => document.getElementById(id);
        const TS = () => firebase.firestore.FieldValue.serverTimestamp();

        // Wenn bereits eingeloggt, direkt ins Menü weiterleiten!
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = '/menu.html';
            }
        });

        function showAuthAlert(msg) {
            $('auth-alert-text').innerText = msg;
            $('auth-alert').classList.remove('hidden');
        }

        function showRegisterView(show) {
            $('auth-alert').classList.add('hidden');
            $('form-login').classList.toggle('hidden', show);
            $('form-register').classList.toggle('hidden', !show);
        }

        async function handleSignIn(e) {
            e.preventDefault();
            $('auth-alert').classList.add('hidden');
            const email = $('login-email').value.trim(), password = $('login-password').value;
            const btn = $('btn-login');
            btn.disabled = true; btn.innerText = 'Wird angemeldet...';
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Weiterleitung erfolgt automatisch über onAuthStateChanged
            } catch (err) {
                showAuthAlert('Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.');
                btn.disabled = false; btn.innerText = 'Anmelden';
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            $('auth-alert').classList.add('hidden');
            const firstName = $('reg-firstname').value.trim(), lastName = $('reg-lastname').value.trim();
            const email = $('reg-email').value.trim(), password = $('reg-password').value;
            const btn = $('btn-register');
            btn.disabled = true; btn.innerText = 'Erstelle Benutzer...';
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.collection('users').doc(cred.user.uid).set({
                    firstName, lastName, displayName: `${firstName} ${lastName}`, email,
                    role: 'user', status: 'pending',
                    permissions: { kalender: true, zeit: true, finanzen: true, tresor: true, admin: false },
                    userPrefs: { notifyWork: true, notifyEvents: true },
                    createdAt: TS()
                });
                await auth.signOut();
                alert('Registrierung erfolgreich! Ein Admin muss dein Konto noch freigeben.');
                showRegisterView(false);
            } catch (err) {
                showAuthAlert('Registrierung fehlgeschlagen: ' + err.message);
            } finally {
                btn.disabled = false; btn.innerText = 'Benutzer jetzt erstellen';
            }
        }
    </script>
</body>
</html>
