<html lang="de">

<title>Ballon-Alarm</title>
<meta name="theme-color" content="#02030a">

<style>
:root, body[data-skin="classic"] { --bg: #06120d; --pan: rgba(10,24,20,.82); --pan2: rgba(255,255,255,.05); --ln: rgba(148,163,184,.16); --ln2: rgba(52,211,153,.5); --a: #34d399; --a2: #6ee7b7; --ar: 52,211,153; --ink: #03170f; --t: #f1f5f9; --mu: #94a3b8; --gold: #fbbf24; --rad: 20px; --rad2: 13px; --cut: 0px; --gl: var(--pan); }
body[data-skin="space"] { --bg: #02030a; --pan: rgba(8,14,28,.84); --pan2: rgba(56,189,248,.05); --ln: rgba(56,189,248,.2); --ln2: rgba(56,189,248,.55); --a: #38bdf8; --a2: #7dd3fc; --ar: 56,189,248; --ink: #04121f; --t: #e6f1ff; --mu: #8aa0bd; --gold: #fbbf24; --rad: 6px; --rad2: 5px; --cut: 12px; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--t); background: radial-gradient(900px 600px at 10% -10%, rgba(var(--ar), .14), transparent 60%), radial-gradient(800px 600px at 100% 110%, rgba(56,189,248,.12), transparent 60%), var(--bg); overflow: hidden; user-select: none; -webkit-user-select: none; }
body[data-skin="space"] { background: radial-gradient(900px 600px at 10% -10%, rgba(168,85,247,.12), transparent 60%), radial-gradient(800px 600px at 100% 110%, rgba(56,189,248,.12), transparent 60%), var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; } .hidden { display: none !important; } [hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 12px; padding: 12px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
/* Panels: klassisch rund, im Weltraum mit abgeschrägten Ecken und Leuchtkante */
.card, .pn { background: var(--pan); border: 1px solid var(--ln); border-radius: var(--rad); position: relative; box-shadow: 0 24px 60px -24px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04); }
body[data-skin="space"] .card, body[data-skin="space"] .pn { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); box-shadow: none; }
body[data-skin="space"] .card::before, body[data-skin="space"] .pn::before { content: ""; position: absolute; left: 16px; top: -1px; width: 46px; height: 2px; background: var(--a); box-shadow: 0 0 10px var(--a); z-index: 1; pointer-events: none; }
body[data-skin="space"] .pn.amber::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--mu); }
body[data-skin="space"] .lbl { color: #7dd3fc; }
.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--ln); background: var(--pan2); padding: 9px 14px; border-radius: var(--rad2); font-weight: 700; font-size: 13.5px; transition: filter .2s, transform .15s; white-space: nowrap; } .btn:hover { filter: brightness(1.25); } .btn:active { transform: scale(.96); } .btn:disabled { opacity: .4; cursor: not-allowed; }
a.btn { text-decoration: none; color: inherit; }
.btn.go { color: var(--ink); border-color: transparent; background: linear-gradient(135deg, var(--a2), var(--a)); box-shadow: 0 10px 24px -10px rgba(var(--ar), .9); }
body[data-skin="space"] .btn.go { background: linear-gradient(180deg, #7dd3fc, #0ea5e9); box-shadow: 0 0 22px rgba(56,189,248,.3); }
.btn.bad { color: #fecdd3; border-color: rgba(244,63,94,.4); background: rgba(244,63,94,.12); } .btn.on { color: var(--ink); background: var(--a); border-color: var(--a); }
.btn.sm { padding: 6px 9px; font-size: 11.5px; } .btn.big { padding: 13px 24px; font-size: 16px; }
.ib { width: 42px; height: 42px; display: inline-grid; place-items: center; flex: none; border: 1px solid var(--ln); background: var(--pan2); border-radius: var(--rad2); color: var(--t); font-weight: 800; font-size: 14px; text-decoration: none; transition: filter .2s; padding: 0; }
.ib:hover { filter: brightness(1.3); } .ib.on { border-color: var(--a); color: var(--a); background: rgba(var(--ar), .12); } .ib:disabled { opacity: .4; cursor: not-allowed; } .ib .ic { width: 19px; height: 19px; }

/* ---------- Spielfeld und HUD ---------- */
.stage { display: flex; flex-direction: column; min-height: 0; padding: 10px; }
.hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 0 10px; }
.hb { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 13px 0 11px; border: 1px solid var(--ln); background: var(--pan2); border-radius: var(--rad2); white-space: nowrap; }
.hb > .ic { width: 20px; height: 20px; }
.hb .k { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); font-weight: 700; line-height: 1; margin-bottom: 4px; }
.hb .v { display: block; font-size: 18px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.hb .bar { display: block; height: 4px; width: 70px; border-radius: 3px; background: rgba(148,163,184,.2); overflow: hidden; margin-top: 4px; } .hb .bar i { display: block; height: 100%; background: #34d399; transition: width .3s; }
.hb.warn { border-color: rgba(244,63,94,.6); animation: pulse 1s ease-in-out infinite; } .hb.warn .bar i { background: #f43f5e; }
#hb-lives .ic { color: #f87171; } #hb-money .ic { color: var(--gold); } #hb-round .ic { color: var(--a); }
.prev { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; padding: 0 4px; }
.pl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .13em; color: var(--mu); font-weight: 700; margin-right: 2px; }
.pc { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 4px; border-radius: 99px; background: var(--pan2); border: 1px solid var(--ln); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; } .pc img { width: 22px; height: 22px; } .pc.t { padding-left: 9px; }
.pc.boss { border-color: rgba(244,63,94,.6); color: #fecdd3; } .pc.coop { border-color: rgba(244,114,182,.5); color: #fbcfe8; } .pc.ch { border-color: rgba(250,204,21,.5); color: #fde68a; } .pc.wx { border-color: rgba(125,211,252,.5); color: #bae6fd; }
.ctl { display: flex; gap: 6px; }
#b-start { height: 42px; padding: 0 16px; }
.cvw { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
#cv { border-radius: calc(var(--rad) - 4px); touch-action: none; display: block; box-shadow: 0 0 0 1px var(--ln), 0 20px 50px -20px rgba(0,0,0,.8); background: #14301f; }
body[data-skin="space"] #cv { background: #02030a; border-radius: 4px; }
/* Fähigkeiten: runde Knöpfe unten auf dem Spielfeld */
.abil { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px 10px; border-radius: 99px; background: rgba(2,6,16,.62); border: 1px solid var(--ln); backdrop-filter: blur(6px); z-index: 5; max-width: calc(100% - 20px); flex-wrap: wrap; justify-content: center; }
body[data-skin="space"] .abil { border-radius: 6px; }
.ab { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(250,204,21,.65); background: rgba(250,204,21,.14); display: grid; place-items: center; padding: 0; transition: transform .15s, filter .2s; }
.ab:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); } .ab img { width: 38px; height: 38px; } .ab.cd { border-color: var(--ln); background: rgba(255,255,255,.04); cursor: default; } .ab.cd img { opacity: .4; }
.ab .ring { position: absolute; inset: -3px; width: 60px; height: 60px; transform: rotate(-90deg); pointer-events: none; }
.ab .tm { position: absolute; font-size: 12.5px; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
.ab .cnt { position: absolute; right: -5px; bottom: -4px; min-width: 22px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #1c1203; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.ab.cd .cnt { background: #334155; color: #cbd5e1; }
.ab .nm { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -6px); font-size: 11px; font-weight: 700; white-space: nowrap; background: rgba(2,6,16,.85); padding: 3px 7px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .15s; } .ab:hover .nm { opacity: 1; }
.toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 15; padding: 10px 16px; border-radius: var(--rad2); background: rgba(15,23,42,.94); border: 1px solid rgba(var(--ar), .5); font-size: 14px; font-weight: 600; pointer-events: none; animation: tin .3s ease-out; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, -10px); } } @keyframes pulse { 50% { opacity: .65; } }
.stage.editing .hb, .stage.editing .prev, .stage.editing .ctl, .stage.editing #b-start { visibility: hidden; } .stage.editing .abil { display: none !important; }

/* ---------- Seitenleiste: Laden und Auswahl ---------- */
.side { display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 12px; gap: 10px; }
.stabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--ln); border-radius: var(--rad2); background: rgba(0,0,0,.2); } .stabs:empty { display: none; }
.stabs button { flex: 1; border: 0; background: none; padding: 7px 0; font-weight: 700; font-size: 13px; color: var(--mu); border-radius: calc(var(--rad2) - 2px); } .stabs button.on { background: var(--pan2); color: var(--t); box-shadow: inset 0 0 0 1px var(--ln); }
#shop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } #shop:empty { display: none; }
.tw { position: relative; padding: 7px 5px 6px; border-radius: var(--rad2); border: 1px solid var(--ln); background: var(--pan2); display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; transition: transform .15s, border-color .2s; min-width: 0; }
.tw .ti { width: 38px; height: 38px; } .tw .n { font-weight: 700; font-size: 11.5px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .tw .c { font-size: 11.5px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.tw .k { position: absolute; top: 4px; left: 6px; font-size: 10px; font-weight: 800; color: var(--mu); }
.tw:hover { transform: translateY(-2px); border-color: rgba(var(--ar), .5); } .tw.sel { border-color: var(--a); background: rgba(var(--ar), .12); box-shadow: inset 0 0 0 1px var(--a); }
.tw.no .c { color: #fca5a5; } .tw.no { opacity: .6; } .tw.off { opacity: .3; filter: grayscale(1); }
#shop2 { display: flex; flex-direction: column; gap: 6px; } #shop2:empty { display: none; }
.hrow { display: grid; grid-template-columns: 1fr; gap: 6px; } .hrow .tw { flex-direction: row; text-align: left; align-items: center; gap: 10px; padding: 10px; background: linear-gradient(135deg, rgba(168,85,247,.14), rgba(56,189,248,.06)); border-color: rgba(168,85,247,.35); }
.hrow .tw .ti { width: 52px; height: 52px; } .hrow .tw .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; } .hrow .tw .n { font-size: 14px; white-space: normal; } .hrow .tw small { color: var(--mu); font-size: 11.5px; line-height: 1.4; white-space: normal; }
.irow { display: grid; grid-template-columns: 1fr; gap: 6px; } .it { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--rad2); border: 1px solid var(--ln); background: var(--pan2); text-align: left; } .it img { width: 34px; height: 34px; } .it .tx { flex: 1; min-width: 0; } .it b { display: block; font-size: 13.5px; } .it small { display: block; color: var(--mu); font-size: 11.5px; line-height: 1.4; } .it .c { font-weight: 800; color: var(--gold); white-space: nowrap; font-size: 13px; }
.it.sel { border-color: var(--a); background: rgba(var(--ar), .12); } .it:hover { border-color: rgba(var(--ar), .5); }
.trow { display: flex; gap: 6px; } .trow .btn { flex: 1; }
.snote { font-size: 12px; color: var(--mu); line-height: 1.5; padding: 2px 2px 0; }
#info { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #334155 transparent; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--ln); padding-top: 10px; }
.help { color: var(--mu); font-size: 13px; line-height: 1.6; } .help b { color: var(--t); }
.steps { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; } .steps li { display: flex; gap: 9px; align-items: flex-start; } .steps li i { flex: none; width: 20px; height: 20px; border-radius: 50%; background: rgba(var(--ar), .16); color: var(--a); font-style: normal; font-weight: 800; font-size: 11.5px; display: grid; place-items: center; margin-top: 1px; }
.keys { margin-top: 8px; font-size: 11.5px; } kbd { font: 700 11px system-ui; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--ln); background: var(--pan2); color: var(--t); }
.ih { display: flex; align-items: center; gap: 12px; } .ti.big { width: 58px; height: 58px; flex: none; border-radius: var(--rad2); background: rgba(0,0,0,.22); } .ih b { font-size: 16.5px; } .ih small { display: block; color: var(--mu); font-size: 12px; line-height: 1.45; margin-top: 2px; }
.tgs { display: flex; gap: 6px; flex-wrap: wrap; } .tg { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: rgba(var(--ar), .14); color: var(--a2); } .tg.off { background: rgba(255,255,255,.05); color: #64748b; }
.st { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .st div { background: var(--pan2); border: 1px solid var(--ln); border-radius: var(--rad2); padding: 7px 6px; text-align: center; font-size: 11px; color: var(--mu); } .st b { display: block; color: var(--t); font-size: 15px; }
.mode { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--ln); border-radius: var(--rad2); overflow: hidden; } .mode button { padding: 7px 2px; font-size: 12px; border: 0; background: none; color: var(--mu); font-weight: 700; } .mode button.on { color: var(--ink); background: var(--a); }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .paths.one { grid-template-columns: 1fr; }
.up { width: 100%; text-align: left; padding: 9px 10px; border-radius: var(--rad2); border: 1px solid var(--ln); background: var(--pan2); display: flex; flex-direction: column; gap: 5px; }
.up .ul, .up .un, .up > span { display: block; } .up .ul { font-size: 10px; color: var(--mu); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; } .up .un { font-weight: 700; font-size: 13px; line-height: 1.25; } .up .uc { font-weight: 800; font-size: 13px; color: #fca5a5; white-space: nowrap; margin-top: auto; padding: 5px 0; text-align: center; border-radius: calc(var(--rad2) - 2px); background: rgba(255,255,255,.05); }
.up.can { border-color: rgba(var(--ar), .5); } .up.can .uc { color: var(--ink); background: var(--a); } .up.max { opacity: .55; } .up small { display: block; font-size: 11px; color: var(--mu); line-height: 1.4; }
.pips { display: flex; gap: 3px; } .pips i { flex: 1; height: 4px; border-radius: 3px; background: #334155; } .pips i.f { background: var(--a); box-shadow: 0 0 6px rgba(var(--ar), .6); }
.up.wide { flex-direction: row; align-items: center; justify-content: space-between; } .up.wide .uc { margin: 0; padding: 5px 10px; }
.up.abl { border-color: rgba(250,204,21,.45); } .up.abl.can { background: rgba(250,204,21,.1); border-color: rgba(250,204,21,.8); } .up.abl.can .uc { color: #1c1203; background: var(--gold); }
.vet { padding: 9px 11px; border-radius: var(--rad2); background: var(--pan2); border: 1px solid var(--ln); font-size: 12px; color: var(--mu); } .vet span { font-weight: 700; color: var(--t); } .vet b { float: right; color: #fde68a; } .vet .bar { height: 5px; border-radius: 5px; background: rgba(255,255,255,.08); margin: 7px 0 4px; overflow: hidden; } .vet .bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #fde68a); } .vet small { display: block; font-size: 11px; }
.hint { font-size: 12px; color: var(--mu); padding: 9px 11px; border-radius: var(--rad2); border: 1px dashed rgba(250,204,21,.35); line-height: 1.5; }
.row2 { display: flex; gap: 6px; } .row2 .btn { flex: 1; font-size: 12.5px; padding: 9px 6px; }
.fld { display: block; } .fld span { display: block; font-size: 11.5px; color: var(--mu); margin-bottom: 4px; } .fld input { width: 100%; font: inherit; font-size: 14px; padding: 9px 11px; border-radius: var(--rad2); border: 1px solid var(--ln); background: rgba(2,6,16,.6); color: #fff; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: var(--rad2); background: rgba(0,0,0,.2); border: 1px solid var(--ln); } .seg button { border: 0; background: none; padding: 7px 12px; border-radius: calc(var(--rad2) - 2px); font-size: 13px; font-weight: 700; color: var(--mu); } .seg button.on { background: var(--a); color: var(--ink); } .seg.full { display: flex; } .seg.full button { flex: 1; padding: 7px 4px; font-size: 12px; }

/* ---------- Menü (Vollbild) ---------- */
.ov { position: fixed; inset: 0; z-index: 40; overflow: hidden; background: var(--bg); }
#mbg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mwrap { position: relative; height: 100%; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 32px; padding: 34px 44px 26px; padding-top: max(34px, env(safe-area-inset-top)); overflow: hidden; }
.mnav { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.brand { margin: 0 0 22px; } .brand .w { font-size: 44px; font-weight: 900; letter-spacing: -.02em; line-height: .95; }
body[data-skin="space"] .brand .w { letter-spacing: .08em; font-size: 38px; background: linear-gradient(180deg, #f8fafc, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .s { margin-top: 8px; color: var(--mu); font-size: 14px; display: flex; align-items: center; gap: 8px; }
body[data-skin="space"] .brand .s { letter-spacing: .3em; text-transform: uppercase; font-size: 11.5px; color: var(--gold); } body[data-skin="space"] .brand .s::before { content: ""; width: 26px; height: 2px; background: var(--gold); }
.nv { display: flex; align-items: center; gap: 13px; min-height: 46px; padding: 0 16px; background: transparent; border: 1px solid transparent; color: var(--t); font-weight: 600; font-size: 15.5px; text-align: left; border-radius: var(--rad2); position: relative; text-decoration: none; flex: none; }
.nv .ic { width: 20px; height: 20px; color: var(--mu); } .nv small { margin-left: auto; color: var(--mu); font-size: 12px; font-weight: 600; }
.nv:hover, .nv.on { background: var(--pan2); border-color: var(--ln); } .nv.on .ic { color: var(--a); }
body[data-skin="space"] .nv.on::before { content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 3px; background: var(--a); box-shadow: 0 0 12px var(--a); }
.nv.main { min-height: 60px; font-size: 17.5px; font-weight: 800; background: linear-gradient(90deg, var(--a2), var(--a)); color: var(--ink); border: 0; margin-bottom: 10px; }
body[data-skin="space"] .nv.main { background: linear-gradient(90deg, #38bdf8, #0284c7); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); box-shadow: 0 0 30px rgba(56,189,248,.3); }
.nv.main .ic { color: var(--ink) !important; } .nv.main small { color: rgba(4,18,31,.72); }
.mnav hr { border: 0; border-top: 1px solid var(--ln); margin: 8px 6px; width: calc(100% - 12px); }
.mfoot { margin-top: auto; padding-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border: 1px solid var(--ln); background: var(--pan); border-radius: var(--rad2); font-weight: 700; font-size: 13px; color: var(--t); text-decoration: none; white-space: nowrap; } .chip .ic { width: 16px; height: 16px; color: var(--gold); }
.mmain { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #334155 transparent; padding: 2px 4px 30px 2px; }
.mpage { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin-left: auto; }
.mpage > h2, .mh h2 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.01em; } .mh { display: flex; flex-direction: column; gap: 4px; } .lead { margin: 0; color: var(--mu); font-size: 14px; line-height: 1.55; }
