<style>

<script>
'use strict';
// ================= Karten =================
const W = 800, H = 600, DT = 1 / 60, KEY = 'ballon-alarm-v1';
const MAPS = {
  wiese: { n: 'Sonnige Wiese', e: '🌿', d: 'Eine gemütliche Strecke zum Üben.', pts: [[-20, 120], [160, 120], [160, 300], [400, 300], [400, 100], [640, 100], [640, 420], [300, 420], [300, 520], [820, 520]], unlock: null },
  zickzack: { n: 'Zickzack-Tal', e: '⚡', d: 'Lange Wege, viele Kurven.', pts: [[-20, 60], [740, 60], [740, 160], [60, 160], [60, 260], [740, 260], [740, 360], [60, 360], [60, 460], [740, 460], [740, 550], [820, 550]], unlock: ['wiese', 15] },
  spirale: { n: 'Die Spirale', e: '🌀', d: 'Alles läuft ins Zentrum.', pts: [[-20, 300], [100, 300], [100, 70], [700, 70], [700, 530], [200, 530], [200, 190], [600, 190], [600, 420], [320, 420], [320, 310], [470, 310]], unlock: ['zickzack', 20] }
};
let PATH = null, BG = null, BGK = 0, curMap = 'wiese';
function buildPath(key) { const pts = MAPS[key].pts, segs = []; let cum = 0; for (let i = 0; i < pts.length - 1; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], len = Math.hypot(x2 - x1, y2 - y1); segs.push({ x1, y1, x2, y2, len, cum }); cum += len; } return { segs, len: cum }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function posAt(d) { const P = PATH; if (d <= 0) return { x: P.segs[0].x1, y: P.segs[0].y1 }; for (const s of P.segs) if (d <= s.cum + s.len) { const t = (d - s.cum) / s.len; return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t }; } const s = P.segs[P.segs.length - 1]; return { x: s.x2, y: s.y2 }; }
function distToPath(x, y) { let m = 1e9; for (const s of PATH.segs) { const dx = s.x2 - s.x1, dy = s.y2 - s.y1, t = clamp(((x - s.x1) * dx + (y - s.y1) * dy) / (s.len * s.len), 0, 1); m = Math.min(m, Math.hypot(x - (s.x1 + dx * t), y - (s.y1 + dy * t))); } return m; }
// ================= Ballons =================
const LAYER = [null, { c: '#ef4444', v: 90, r: 12, n: 'Rot' }, { c: '#3b82f6', v: 110, r: 13.5, n: 'Blau' }, { c: '#22c55e', v: 130, r: 15, n: 'Grün' }, { c: '#facc15', v: 165, r: 16, n: 'Gelb' }, { c: '#ec4899', v: 190, r: 17, n: 'Rosa' }];
function waveFor(r) {
  const ev = [], main = Math.min(5, 1 + Math.floor((r - 1) / 6)), gap = Math.max(0.16, 0.62 - r * 0.012), n = Math.min(160, 14 + r * 2), groups = []; let t = 0;
  groups.push([main, n, gap]); if (main > 1) groups.push([main - 1, Math.floor(n * 0.7), gap * 0.9]);
  if (r % 5 === 0 && main < 5) groups.push([main + 1, Math.floor(n * 0.4), gap]); if (main >= 3) groups.push([1, Math.floor(n * 0.5), gap * 0.5]);
  groups.forEach(([l, c, g]) => { for (let i = 0; i < c; i++) ev.push({ t: t + i * g, layer: l }); t += c * g + 1.2; });
  if (r % 10 === 0) ev.push({ t: 0.5, boss: Math.round(120 * Math.pow(r / 10, 1.8)) });
  return ev.sort((a, b) => a.t - b.t);
}
// ================= Türme =================
// base: Grundwerte. A/B: je 3 Stufen [Name, Preis, Wirkung]. add = addieren, mul = multiplizieren, set = setzen.
const TOWERS = {
  dart: { n: 'Dartschütze', e: '🎯', c: '#38bdf8', cost: 200, key: '1', d: 'Schnell und günstig. Trifft einzelne Ballons.', base: { kind: 'dart', range: 110, rate: 0.8, dmg: 1, pierce: 2, shots: 1, speed: 520 },
    A: [['Schärfere Darts', 120, { add: { pierce: 2 } }], ['Dreifach-Wurf', 280, { set: { shots: 3 } }], ['Superspitzen', 900, { add: { dmg: 2, pierce: 3 } }]], B: [['Weitsicht', 100, { add: { range: 25 } }], ['Schnellfeuer', 250, { mul: { rate: 0.7 } }], ['Dauerfeuer', 800, { mul: { rate: 0.45 } }]] },
  boom: { n: 'Bumerang', e: '🌙', c: '#f59e0b', cost: 330, key: '2', d: 'Fliegt durch viele Ballons hindurch.', base: { kind: 'dart', range: 120, rate: 1.1, dmg: 1, pierce: 7, shots: 1, speed: 330, disc: true },
    A: [['Größere Scheiben', 180, { add: { pierce: 5 } }], ['Glühende Kanten', 400, { add: { dmg: 1 } }], ['Wirbelsturm', 1100, { add: { pierce: 12, dmg: 1 }, set: { shots: 2 } }]], B: [['Reichweite', 150, { add: { range: 30 } }], ['Schneller werfen', 300, { mul: { rate: 0.7 } }], ['Dauerwurf', 900, { mul: { rate: 0.5 } }]] },
  bomb: { n: 'Kanone', e: '💣', c: '#ef4444', cost: 600, key: '3', d: 'Flächenschaden: trifft alle in der Nähe.', base: { kind: 'bomb', range: 135, rate: 1.8, dmg: 1, splash: 46, speed: 340 },
    A: [['Größere Bomben', 300, { add: { splash: 14 } }], ['Splitterbomben', 650, { add: { dmg: 1 } }], ['Mega-Bombe', 1800, { add: { splash: 32, dmg: 2 } }]], B: [['Weitschuss', 250, { add: { range: 30 } }], ['Schnell nachladen', 500, { mul: { rate: 0.65 } }], ['Kanonenfeuer', 1500, { mul: { rate: 0.45 } }]] },
  ice: { n: 'Eisturm', e: '❄️', c: '#7dd3fc', cost: 350, key: '4', d: 'Bremst alle Ballons in der Nähe aus.', base: { kind: 'ice', range: 85, rate: 1.7, dmg: 0, freeze: 1.3, slow: 0.45 },
    A: [['Längere Kälte', 200, { add: { freeze: 0.8 } }], ['Tiefkühlung', 450, { set: { slow: 0.15 } }], ['Eiszeit', 1300, { add: { freeze: 2, dmg: 1 } }]], B: [['Reichweite', 180, { add: { range: 25 } }], ['Schneller Puls', 350, { mul: { rate: 0.7 } }], ['Blizzard', 1000, { mul: { rate: 0.55 }, add: { range: 30 } }]] },
  sniper: { n: 'Scharfschütze', e: '🔭', c: '#a78bfa', cost: 450, key: '5', d: 'Trifft überall auf der Karte, aber langsam.', base: { kind: 'sniper', range: 99999, rate: 1.9, dmg: 3 },
    A: [['Großkaliber', 350, { add: { dmg: 3 } }], ['Panzerbrecher', 800, { add: { dmg: 6 } }], ['Kanonenkugel', 2000, { add: { dmg: 14 } }]], B: [['Schnelle Repetition', 300, { mul: { rate: 0.7 } }], ['Automatik', 700, { mul: { rate: 0.6 } }], ['Dauerfeuer', 1700, { mul: { rate: 0.5 } }]] },
  bank: { n: 'Bank', e: '🏦', c: '#fbbf24', cost: 500, key: '6', d: 'Zahlt am Ende jeder Runde Geld aus.', base: { kind: 'bank', range: 0, rate: 99, income: 110 },
    A: [['Zinsen', 400, { add: { income: 90 } }], ['Fonds', 900, { add: { income: 250 } }], ['Investmentbank', 2200, { add: { income: 700 } }]], B: [] }
};
const MODES = [['first', 'Erster'], ['last', 'Letzter'], ['strong', 'Stärkster'], ['close', 'Nächster']];
const META = [['startMoney', 'Startkapital', '+50 € zum Start je Stufe', 8, 1.6], ['lives', 'Sicherheitsnetz', '+5 Leben je Stufe', 10, 1.6], ['discount', 'Mengenrabatt', 'Türme und Upgrades 2 % günstiger je Stufe', 15, 1.7], ['bonus', 'Scharfe Augen', '+5 % Geld für jeden geplatzten Ballon je Stufe', 12, 1.6], ['roundBonus', 'Rundenprämie', '+10 € Rundenbonus je Stufe', 12, 1.6]];
const META_MAX = 10;
// ================= Zustand =================
const freshMeta = () => ({ diamonds: 0, up: { startMoney: 0, lives: 0, discount: 0, bonus: 0, roundBonus: 0 }, best: { wiese: 0, zickzack: 0, spirale: 0 }, runs: 0, popped: 0, snd: false });
let M = freshMeta(), S = null, savedRun = null, placing = null, ghost = null, selTower = null, acc = 0, lastT = performance.now(), menuTab = 'play', pickMap = 'wiese';
const $ = id => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');
const fmt = n => Math.floor(n).toLocaleString('de-DE');
const price = c => Math.round(c * (1 - 0.02 * M.up.discount));
function newRun(map) {
  curMap = map; PATH = buildPath(map); BG = null;
  S = { map, round: 1, money: 650 + 50 * M.up.startMoney, lives: 100 + 5 * M.up.lives, towers: [], balloons: [], projs: [], fx: [], queue: [], waveT: 0, active: false, speed: 1, paused: false, over: false, auto: false, autoIn: 0, nid: 1, popped: 0 };
  selTower = null; placing = null; renderAll(); return S;
}
// ================= Türme: Werte =================
function stats(t) { const d = TOWERS[t.t], s = { ...d.base }; [['A', t.a], ['B', t.b]].forEach(([p, n]) => { for (let i = 0; i < n; i++) { const fx = d[p][i][2]; for (const k in fx.add || {}) s[k] = (s[k] || 0) + fx.add[k]; for (const k in fx.mul || {}) s[k] *= fx.mul[k]; for (const k in fx.set || {}) s[k] = fx.set[k]; } }); return s; }
function validSpot(x, y, ignore) { if (x < 22 || x > W - 22 || y < 22 || y > H - 22) return false; if (distToPath(x, y) < 30) return false; return !S.towers.some(t => t !== ignore && Math.hypot(t.x - x, t.y - y) < 36); }
function place(type, x, y) {
  const d = TOWERS[type]; if (!d || S.over) return null; const c = price(d.cost); if (S.money < c || !validSpot(x, y)) return null;
  S.money -= c; const t = { t: type, x, y, a: 0, b: 0, cd: 0.2, mode: 'first', spent: c, ang: 0 }; t.s = stats(t); S.towers.push(t); idleSave(); renderAll(); return t;
}
function upgrade(t, path) { const d = TOWERS[t.t], n = path === 'A' ? t.a : t.b, up = d[path][n]; if (!up) return false; const c = price(up[1]); if (S.money < c) return false; S.money -= c; t.spent += c; if (path === 'A') t.a++; else t.b++; t.s = stats(t); idleSave(); renderAll(); return true; }
function sell(t) { const i = S.towers.indexOf(t); if (i < 0) return false; S.money += Math.floor(t.spent * 0.7); S.towers.splice(i, 1); if (selTower === t) selTower = null; idleSave(); renderAll(); return true; }
// ================= Runde =================
function startRound() { if (!S || S.active || S.over) return false; S.queue = waveFor(S.round); S.waveT = 0; S.active = true; S.autoIn = 0; renderAll(); return true; }
function spawn(e) { const b = e.boss ? { id: S.nid++, boss: true, hp: e.boss, max: e.boss, layer: 6, d: 0, slowT: 0, slowF: 1 } : { id: S.nid++, layer: e.layer, d: e.d || 0, slowT: 0, slowF: 1 }; const p = posAt(b.d); b.x = p.x; b.y = p.y; S.balloons.push(b); }
const rad = b => (b.boss ? 36 : LAYER[b.layer].r);
function hit(b, dmg) {

    ${upBtn('A', s.kind === 'bank' ? 'Ausbau' : 'Pfad A: Kraft')}${upBtn('B', 'Pfad B: Tempo und Reichweite')}<button class="btn bad" style="width:100%;margin-top:4px" data-sell>Verkaufen für ${fmt(Math.floor(t.spent * 0.7))} €</button>`;
}
function renderAll() { renderHud(); renderShop(); renderInfo(); }
function mapOpen(k) { const u = MAPS[k].unlock; return !u || (M.best[u[0]] || 0) >= u[1]; }

  if (kind === 'over') { o.innerHTML = `<div class="card box"><h2>Spiel vorbei</h2><p class="lead">Du hast ${S.round - 1} Runden geschafft auf „${MAPS[S.map].n}“. Bestwert: ${M.best[S.map]}.</p><p style="font-size:18px">Du erhältst <span class="dia">${S.earned} 💎</span> (insgesamt ${M.diamonds} 💎). Damit verbesserst du dauerhaft deine Starts.</p><div class="row"><button class="btn" id="o-up">Verbesserungen</button><button class="btn go" id="o-new">Neues Spiel</button></div></div>`; $('o-new').onclick = () => { menuTab = 'play'; showOverlay('menu'); }; $('o-up').onclick = () => { menuTab = 'up'; showOverlay('menu'); }; return; }

  if (menuTab === 'play') {
    o.innerHTML = `<div class="card box"><h2>🎈 Ballon-Alarm</h2><p class="lead">Halte die Ballons auf, bevor sie ins Ziel kommen. Ein Spiel ohne Ende: Wie viele Runden schaffst du?</p>${tabs}
      <div class="maps">${Object.entries(MAPS).map(([k, m]) => { const open = mapOpen(k); return `<button class="mp${k === pickMap ? ' sel' : ''}${open ? '' : ' lock'}" data-map="${k}" ${open ? '' : 'disabled'}><span class="me">${open ? m.e : '🔒'}</span><b>${m.n}</b><small>${m.d}<br>Bestwert: Runde ${M.best[k] || 0}${open ? '' : `<br>Freischalten: Runde ${m.unlock[1]} auf „${MAPS[m.unlock[0]].n}“`}</small></button>`; }).join('')}</div>
      <div class="row">${savedRun ? `<button class="btn" id="o-resume">Fortsetzen (Runde ${savedRun.round}, ${MAPS[savedRun.map].n})</button>` : ''}<button class="btn go" id="o-start">Neues Spiel starten</button>${S && !S.over ? '<button class="btn" id="o-close">Zurück zum Spiel</button>' : ''}</div></div>`;
    o.querySelectorAll('[data-map]').forEach(b => b.onclick = () => { pickMap = b.dataset.map; showOverlay('menu'); });

    o.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buyMeta(b.dataset.buy)); $('o-back').onclick = () => { menuTab = 'play'; showOverlay('menu'); };

function buyMeta(k) { const m = META.find(x => x[0] === k); if (!m) return false; const lv = M.up[k], cost = Math.ceil(m[3] * Math.pow(m[4], lv)); if (lv >= META_MAX || M.diamonds < cost) return false; M.diamonds -= cost; M.up[k]++; saveMeta(); if (!$('ov').classList.contains('hidden')) showOverlay('menu'); return true; }
const hideOverlay = () => $('ov').classList.add('hidden');
// ================= Bedienung =================
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }

    if (!S || S.over || e.button === 2) return; const p = toWorld(e);

    let near = null, nd = 24; for (const t of S.towers) { const d = Math.hypot(t.x - p.x, t.y - p.y); if (d < nd) { near = t; nd = d; } } selTower = near; renderAll();
  });
  cv.addEventListener('contextmenu', e => { e.preventDefault(); placing = null; renderAll(); });
  $('info').onclick = e => {
    const t = selTower; if (!t) return; const u = e.target.closest('[data-up]'), m = e.target.closest('[data-mode]'), s = e.target.closest('[data-sell]');
    if (u) { if (!upgrade(t, u.dataset.up)) toast('Nicht genug Geld'); } else if (m) { t.mode = m.dataset.mode; renderInfo(); } else if (s && confirm('Turm verkaufen?')) sell(t);
  };
  $('b-start').onclick = () => startRound(); $('b-speed').onclick = () => { S.speed = S.speed % 3 + 1; renderHud(); }; $('b-pause').onclick = () => { S.paused = !S.paused; renderHud(); };
  $('b-auto').onclick = () => { S.auto = !S.auto; if (S.auto && !S.active) S.autoIn = 0.3; renderHud(); };
  $('b-menu').onclick = () => { menuTab = 'play'; showOverlay('menu'); };
  document.addEventListener('keydown', e => {
    if (!S || /INPUT|TEXTAREA/.test(e.target.tagName)) return; const k = e.key.toLowerCase();
    const t = Object.entries(TOWERS).find(([, d]) => d.key === e.key); if (t && !S.over) return setPlacing(t[0]);
    if (k === 'escape') { placing = null; selTower = null; renderAll(); } else if (k === ' ') { e.preventDefault(); startRound(); } else if (k === 'f') { S.speed = S.speed % 3 + 1; renderHud(); } else if (k === 'p') { S.paused = !S.paused; renderHud(); }
  });
  window.addEventListener('resize', fit); window.addEventListener('pagehide', () => { idleSave(); saveMeta(); }); document.addEventListener('visibilitychange', () => { if (document.hidden) { idleSave(); if (S && S.active) { S.paused = true; renderHud(); } } else lastT = performance.now(); });
}
function loop(now) { const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; if (S && !S.over && !S.paused) { acc += dt * S.speed; let n = 0; while (acc >= DT && n < 24) { step(); acc -= DT; n++; } if (acc > DT * 24) acc = 0; } draw(); const h = $('h-money'); if (S && h.textContent !== fmt(S.money)) { renderHud(); renderShop(); if (selTower) renderInfo(); } else if (S) { renderHud(); } requestAnimationFrame(loop); }
// ================= Start =================
load(); newRun('wiese'); wire(); fit(); showOverlay('menu'); requestAnimationFrame(loop);
