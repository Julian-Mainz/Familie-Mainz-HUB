<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Uhr</title>
    <meta name="theme-color" content="#050816">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%2338bdf8' stroke-width='6'/%3E%3Cpath d='M32 16v17l11 7' fill='none' stroke='%2338bdf8' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        :root { --a: #38bdf8; --ar: 56,189,248; --br: 99,102,241; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; color: #fff;
            font-family: "Helvetica Neue", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
        body { background: #050816; }
        #stage { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
        #clock { display: inline-flex; align-items: baseline; white-space: nowrap; line-height: 1; font-weight: 200; letter-spacing: -.02em; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
        #cs { display: inline-flex; align-items: baseline; }
        .c { display: inline-block; padding: 0 .02em; animation: blink 2s steps(1) infinite; }
        #ap { font-size: .2em; margin-left: .3em; opacity: .7; font-weight: 400; letter-spacing: .05em; }
        #d { margin-top: 2.4vh; font-size: clamp(.9rem, 2.6vw, 2rem); letter-spacing: .32em; text-transform: uppercase; text-align: center; padding: 0 4vw; opacity: .75; }
        @keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: .25 } }

        /* ---------- Aurora: weicher, wandernder Farbverlauf, dünne Ziffern mit Verlauf ---------- */
        body.s-aurora { background: #050816; }
        body.s-aurora::before { content: ""; position: fixed; inset: -30%; z-index: 0; will-change: transform;
            background: radial-gradient(38% 38% at 24% 30%, rgba(var(--ar), .55), transparent 70%), radial-gradient(42% 42% at 76% 32%, rgba(var(--br), .5), transparent 70%), radial-gradient(48% 48% at 50% 82%, rgba(var(--ar), .32), transparent 70%);
            animation: drift 30s ease-in-out infinite alternate; }
        @keyframes drift { 0% { transform: translate3d(-4%, -3%, 0) rotate(0) scale(1); } 100% { transform: translate3d(4%, 3%, 0) rotate(16deg) scale(1.15); } }
        body.s-aurora #clock { font-weight: 200; }
        body.s-aurora .g, body.s-aurora .c { background: linear-gradient(180deg, #fff 35%, var(--a) 140%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        body.s-aurora #cs { font-size: .36em; margin-left: .18em; }
        body.s-aurora #cs .c { display: none; }
        body.s-aurora #cs .g { background: none; color: var(--a); -webkit-text-fill-color: var(--a); font-weight: 300; }
        body.s-aurora #d { color: #dbeafe; }

        /* ---------- Neon: leuchtende Ziffern ---------- */
        body.s-neon { background: radial-gradient(ellipse 90% 60% at 50% 115%, rgba(var(--br), .45), transparent 65%), #05060f; }
        body.s-neon #clock { font-weight: 600; color: #fff; text-shadow: 0 0 .03em #fff, 0 0 .1em rgba(var(--ar), 1), 0 0 .3em rgba(var(--ar), .85), 0 0 .7em rgba(var(--br), .75); }
        body.s-neon #d { color: var(--a); text-shadow: 0 0 .6em rgba(var(--ar), .8); }

        /* ---------- Flip: Klappzahlen wie bei der Bahnhofsuhr ---------- */
        body.s-flip { background: #111317; }
        body.s-flip #clock { font-weight: 700; color: #f3f4f6; align-items: center; perspective: 1200px; }
        body.s-flip .g { position: relative; padding: .05em .1em; margin: 0 .02em; border-radius: .1em; background: linear-gradient(#2c2f36 50%, #22252b 50%); box-shadow: 0 .02em .06em rgba(0,0,0,.6), inset 0 .01em 0 rgba(255,255,255,.07); }
        body.s-flip .g::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: .012em; min-height: 2px; background: rgba(0,0,0,.85); }
        body.s-flip .c { color: var(--a); font-size: .55em; opacity: 1; animation: none; }
        body.s-flip .g.flip { animation: flipin .5s ease-out; }
        @keyframes flipin { 0% { transform: rotateX(-75deg); filter: brightness(.55); } 100% { transform: rotateX(0); filter: none; } }
        body.s-flip #d { color: #9ca3af; }

        /* ---------- Retro: Bernstein-Monitor ---------- */
        body.s-retro { background: #0a0700; }
        body.s-retro::after { content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
        body.s-retro #clock, body.s-retro #d { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; color: #ffb000; text-shadow: 0 0 .05em rgba(255,176,0,.95), 0 0 .22em rgba(255,120,0,.55); }
        body.s-retro #clock { font-weight: 700; }

        /* ---------- Hell ---------- */
        body.s-hell { background: linear-gradient(160deg, #ffffff, #eef1f6); color: #0f172a; }
        body.s-hell #clock { font-weight: 300; color: #0f172a; }
        body.s-hell #cs { font-size: .36em; margin-left: .18em; color: var(--a); }
        body.s-hell #cs .c { display: none; }
        body.s-hell #d { color: #475569; }

        /* ---------- Nacht: dunkelrot, blendet nicht ---------- */
        body.s-nacht { background: #000; }
        body.s-nacht #clock { font-weight: 300; color: #d6342a; }
        body.s-nacht #d { color: #7a1c17; }

        /* ---------- Feierabend-Timer ---------- */
        #timer { width: min(90vw, 1000px); margin-top: 3vh; text-align: center; --tc: var(--a); }
        #tm-label { font-size: clamp(.75rem, min(2.2vw, 2.6vh), 1.6rem); letter-spacing: .22em; text-transform: uppercase; opacity: .8; }
        #tm-val { font-size: clamp(1.8rem, min(10vw, 14vh), 7.5rem); font-weight: 600; line-height: 1.05; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--tc); margin-top: .5vh; }
        #tm-bar { height: clamp(6px, 1.2vh, 12px); background: rgba(128,128,128,.25); border-radius: 99px; overflow: hidden; margin: 2vh auto 0; max-width: 760px; }
        #tm-fill { height: 100%; width: 0; background: var(--tc); border-radius: inherit; transition: width .9s linear; }
        #tm-sub { font-size: clamp(.75rem, min(2vw, 2.4vh), 1.4rem); opacity: .7; margin-top: 1.2vh; }
        #timer[data-state="pre"] #tm-label, #timer[data-state="post"] #tm-label { font-size: clamp(1.3rem, min(5.5vw, 9vh), 4.2rem); letter-spacing: .04em; text-transform: none; opacity: 1; color: var(--tc); font-weight: 600; }
        #timer[data-state="pre"] #tm-val, #timer[data-state="post"] #tm-val, #timer[data-state="pre"] #tm-bar, #timer[data-state="post"] #tm-bar { display: none; }
        body.s-hell #timer { --tc: #0369a1; } body.s-nacht #timer { --tc: #d6342a; } body.s-retro #timer { --tc: #ffb000; font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; text-shadow: 0 0 .05em rgba(255,176,0,.9), 0 0 .3em rgba(255,120,0,.45); }
        body.s-neon #tm-val { text-shadow: 0 0 .08em var(--tc), 0 0 .3em rgba(var(--ar), .8); }
        #tmcfg { display: inline-flex; align-items: center; gap: 4px; color: #fff; font-size: 12px; }
        #tmcfg input { font: inherit; color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 8px; padding: 6px 6px; color-scheme: dark; }

        /* ---------- Bedienleiste ---------- */
        #legal { position: fixed; z-index: 4; left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px; opacity: .55; }
        #legal a { color: inherit; text-decoration: none; } #legal a:hover { text-decoration: underline; }
        #ctl { position: fixed; z-index: 5; left: 50%; bottom: max(38px, calc(env(safe-area-inset-bottom) + 30px)); transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            padding: 8px 10px; max-width: 96vw; background: rgba(20,20,28,.72); border-radius: 16px; transition: opacity .4s; font-size: 13px; }
        #ctl button, #ctl a { font: inherit; color: #fff; background: rgba(255,255,255,.14); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
        #ctl button:hover, #ctl a:hover { background: rgba(255,255,255,.28); }
        body.idle { cursor: none; }
        body.idle #ctl { opacity: 0; pointer-events: none; }
        #syncinfo { width: 100%; text-align: center; font-size: 12px; opacity: .85; padding: 2px 4px 0; }
        #warn { display: none; position: fixed; z-index: 6; right: 14px; bottom: 14px; font-size: 13px; color: #fbbf24; background: rgba(0,0,0,.6); padding: 7px 11px; border-radius: 10px; }
        body.unsynced #warn { display: block; }
        body.unsynced #clock, body.unsynced #timer { opacity: .3; }
        #clock { transition: opacity .6s; }
        @media (prefers-reduced-motion: reduce) { body::before, .c, .g.flip { animation: none !important; } }
        noscript { position: fixed; inset: 0; display: grid; place-items: center; font-size: 1.2rem; color: #fff; }
    </style>
</head>
<body class="s-aurora">
    <main id="stage" ondblclick="toggleFs()">
        <div id="clock"><span class="g" id="gh">00</span><span class="c">:</span><span class="g" id="gm">00</span><span id="cs"><span class="c">:</span><span class="g" id="gs">00</span></span><span id="ap"></span></div>
        <div id="timer" data-state="run" style="display:none"><div id="tm-label"></div><div id="tm-val">00:00:00</div><div id="tm-bar"><div id="tm-fill"></div></div><div id="tm-sub"></div></div>
        <div id="d"></div>
    </main>

    <nav id="ctl" aria-label="Einstellungen">
        <div id="syncinfo"></div>
        <button id="b-st" onclick="nextStyle()">Stil</button>
        <button id="b-ac" onclick="nextAccent()">Akzent</button>
        <button id="b-sec" onclick="toggle('sec')">Sekunden</button>
        <button id="b-h" onclick="toggle('h24')">24 h</button>
        <button id="b-date" onclick="toggle('date')">Datum</button>
        <button id="b-timer" onclick="toggle('timer')">Timer</button>
        <span id="tmcfg" title="Arbeitszeit für den Feierabend-Timer"><input type="time" id="t-start" onchange="setTimerTimes()" aria-label="Arbeitsbeginn"> – <input type="time" id="t-end" onchange="setTimerTimes()" aria-label="Feierabend"></span>
        <button id="b-tz" onclick="toggle('berlin')">Zone</button>
        <button id="b-fs" onclick="toggleFs()">Vollbild</button>
    </nav>
    <footer id="legal"><a href="/impressum.html">Impressum</a> &middot; <a href="/datenschutz.html">Datenschutz</a></footer>
    <div id="warn">Zeit wird abgeglichen …</div>
    <noscript>Bitte JavaScript aktivieren, damit die Uhr läuft.</noscript>

    <script>
        const $ = id => document.getElementById(id);
        const STYLES = [['aurora', 'Aurora', '#050816'], ['neon', 'Neon', '#05060f'], ['flip', 'Flip', '#111317'], ['retro', 'Retro', '#0a0700'], ['hell', 'Hell', '#f4f6fa'], ['nacht', 'Nacht', '#000000']];
        const ACC = [{ n: 'Blau', a: '#38bdf8', ar: '56,189,248', br: '99,102,241' }, { n: 'Violett', a: '#c084fc', ar: '192,132,252', br: '236,72,153' },
                     { n: 'Grün', a: '#34d399', ar: '52,211,153', br: '34,211,238' }, { n: 'Orange', a: '#fb923c', ar: '251,146,60', br: '244,63,94' }];
        const S = { sec: true, h24: true, date: false, style: 0, acc: 0, berlin: true, timer: true, tStart: '07:00', tEnd: '16:00' };
        try { Object.assign(S, JSON.parse(localStorage.getItem('uhr_settings2') || '{}')); } catch (e) {}
        const okT = v => /^([01]\d|2[0-3]):[0-5]\d$/.test(v || '');
        if (!okT(S.tStart) || !okT(S.tEnd) || S.tEnd <= S.tStart) { S.tStart = '07:00'; S.tEnd = '16:00'; }
        if (!STYLES[S.style]) S.style = 0; if (!ACC[S.acc]) S.acc = 0;
        const save = () => { try { localStorage.setItem('uhr_settings2', JSON.stringify(S)); } catch (e) {} };
        const p = n => String(n).padStart(2, '0');
        // Nur den vorhandenen Text-Knoten ändern (spart Arbeit bei der sekündlichen Aktualisierung)
        const setT = (el, t) => { const n = el.firstChild; if (n && n.nodeType === 3) { if (n.nodeValue !== t) n.nodeValue = t; } else el.textContent = t; };
        const prev = {};
        function setG(id, v) {
            if (prev[id] === v) return;
            const el = $(id); setT(el, v);
            if (prev[id] !== undefined && STYLES[S.style][0] === 'flip') { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
            prev[id] = v;
        }
        let lastDay = '', FT, FD;
        function makeFormatters() {
            const tz = S.berlin ? 'Europe/Berlin' : undefined;
            FT = new Intl.DateTimeFormat('de-DE', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
            FD = new Intl.DateTimeFormat('de-DE', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            lastDay = '';
        }
        function render(ms) {
            const v = {}; FT.formatToParts(ms).forEach(x => { v[x.type] = x.value; });
            let h = +v.hour, ap = '';
            if (!S.h24) { ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
            setG('gh', p(h)); setG('gm', v.minute); if (S.sec) setG('gs', v.second);
            setT($('ap'), ap); document.title = p(h) + ':' + v.minute + (S.sec ? ':' + v.second : '');
            const day = FD.format(ms); if (day !== lastDay) { lastDay = day; $('d').textContent = day; }
            renderTimer(v);
        }

        // ---------- Zeitabgleich ----------
        // Die Uhr des PCs wird NICHT als Wahrheit genommen. Stattdessen fragt die Seite ihren eigenen Server nach der Zeit
        // (Datumsangabe der Antwort, auf die Sekunde genau). Mehrere Anfragen zu unterschiedlichen Zeitpunkten grenzen den Wert auf Bruchteile
        // einer Sekunde ein. Als Zeitgeber dient der Zähler des Browsers, der auch bei verstellter Systemuhr gleichmäßig weiterläuft.
        const local = () => performance.timeOrigin + performance.now();
        let offset = 0, accuracy = null, synced = false, syncing = false, failed = false;
        const trueNow = () => local() + offset;
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const dur = ms => {
            const t = Math.round(Math.abs(ms) / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60, out = [];
            if (h) out.push(h + ' Std'); if (m) out.push(m + ' Min'); if (!h && (sec || !m)) out.push(sec + ' s');
            return out.join(' ');
        };
        function updateStatus() {
            document.body.classList.toggle('unsynced', !synced);
            $('warn').textContent = failed ? '⚠ Gerätezeit – Abgleich nicht möglich (offline?)' : 'Zeit wird abgeglichen …';
            if (!synced) { $('syncinfo').textContent = failed ? 'Zeit des Geräts, nicht abgeglichen' : ''; return; }
            const dev = -offset;      // Abweichung der PC-Uhr (positiv = PC geht vor)
            $('syncinfo').textContent = Math.abs(dev) < 1500 ? 'Abgeglichen: Die PC-Uhr stimmt' + (accuracy != null ? ' (±' + Math.max(0.05, accuracy / 1000).toFixed(1).replace('.', ',') + ' s)' : '')
                : 'Abgeglichen: Die PC-Uhr geht ' + dur(dev) + (dev > 0 ? ' vor' : ' nach') + (accuracy != null ? ' (±' + Math.max(0.05, accuracy / 1000).toFixed(1).replace('.', ',') + ' s)' : '');
        }
        async function sync() {
            if (syncing) return; syncing = true;
            let lo = -Infinity, hi = Infinity, ok = 0; const mids = [];
            try {
                for (let i = 0; i < 14 && (ok < 4 || hi - lo > 160); i++) {
                    const ts = local(); let res;
                    try { res = await fetch('/Uhr/?sync=' + Math.random().toString(36).slice(2), { method: 'HEAD', cache: 'no-store' }); } catch (e) { break; }
                    const tr = local(), d = res.headers.get('date');
                    if (!res.ok || !d || (+res.headers.get('age') || 0) > 0) continue;       // nur frische, nicht zwischengespeicherte Antworten
                    const sec = Math.floor(Date.parse(d) / 1000) * 1000, l = sec - tr, h = sec + 1000 - ts;   // wahre Serverzeit liegt in [sec, sec+1000)
                    mids.push((l + h) / 2); ok++;
                    if (Math.max(lo, l) <= Math.min(hi, h)) { lo = Math.max(lo, l); hi = Math.min(hi, h); } else { lo = l; hi = h; }
                    await sleep(90 + Math.random() * 300);
                }
                if (ok >= 2) {
                    mids.sort((a, b) => a - b);
                    offset = hi >= lo ? (lo + hi) / 2 : mids[Math.floor(mids.length / 2)];
                    accuracy = hi >= lo ? (hi - lo) / 2 : null; synced = true; failed = false;
                } else if (!synced) failed = true;
            } finally { syncing = false; }
            updateStatus();
            if (synced) { render(trueNow()); fit(); }
            if (!synced) setTimeout(sync, 10000);       // bei Fehlschlag in 10 Sekunden erneut versuchen
        }
        // ---------- Feierabend-Timer: läuft jeden Tag zwischen Beginn und Ende (Standard 07:00 bis 16:00), davor und danach steht ein Hinweis ----------
        const toSec = hhmm => { const a = hhmm.split(':'); return +a[0] * 3600 + +a[1] * 60; };
        const hms = x => p(Math.floor(x / 3600)) + ':' + p(Math.floor(x % 3600 / 60)) + ':' + p(x % 60);
        const inMin = x => { const m = Math.ceil(x / 60), h = Math.floor(m / 60); return h ? h + ' Std ' + (m % 60) + ' Min' : m + ' Min'; };
        let tmState = '';
        function renderTimer(v) {
            const tm = $('timer'); if (!S.timer) return;
            const now = +v.hour * 3600 + +v.minute * 60 + +v.second, a = toSec(S.tStart), e = toSec(S.tEnd);
            const state = now < a ? 'pre' : now >= e ? 'post' : 'run';
            if (state !== tmState) { tmState = state; tm.dataset.state = state; fit(); }
            if (state === 'run') {
                setT($('tm-label'), 'Noch bis Feierabend (' + S.tEnd + ' Uhr)'); setT($('tm-val'), hms(e - now));
                const pct = (now - a) / (e - a) * 100; $('tm-fill').style.width = pct.toFixed(2) + '%'; setT($('tm-sub'), Math.floor(pct) + ' % des Arbeitstags geschafft');
            } else if (state === 'pre') { setT($('tm-label'), 'Timer startet gleich'); setT($('tm-sub'), 'um ' + S.tStart + ' Uhr · in ' + inMin(a - now)); }
            else { setT($('tm-label'), 'Feierabend!'); setT($('tm-sub'), 'Der Timer startet morgen um ' + S.tStart + ' Uhr'); }
        }
        function setTimerTimes() {
            const a = $('t-start').value, e = $('t-end').value;
            if (!okT(a) || !okT(e) || e <= a) { $('t-start').value = S.tStart; $('t-end').value = S.tEnd; $('syncinfo').textContent = 'Der Feierabend muss nach dem Arbeitsbeginn liegen.'; setTimeout(updateStatus, 2800); return; }
            S.tStart = a; S.tEnd = e; tmState = ''; apply(); save();
        }
        function tick() { const t = trueNow(); render(t); setTimeout(tick, 1000 - (t % 1000) + 5); }   // exakt auf den Sekundenwechsel

        // Schrift so groß wie möglich, ohne dass etwas abgeschnitten wird
        function fit() {
            const t = $('clock'); t.style.fontSize = '100px';
            const w = t.scrollWidth, h = t.scrollHeight, maxH = innerHeight * Math.max(0.3, 0.84 - (S.date ? 0.18 : 0) - (S.timer ? 0.26 : 0));
            t.style.fontSize = Math.max(16, Math.floor(100 * Math.min(innerWidth * 0.95 / w, maxH / h))) + 'px';
        }
        function apply() {
            const st = STYLES[S.style], ac = ACC[S.acc], r = document.documentElement.style;
            document.body.className = 's-' + st[0] + (document.body.classList.contains('idle') ? ' idle' : '') + (synced ? '' : ' unsynced');
            r.setProperty('--a', ac.a); r.setProperty('--ar', ac.ar); r.setProperty('--br', ac.br);
            document.querySelector('meta[name="theme-color"]').content = st[2];
            $('d').style.display = S.date ? '' : 'none'; $('cs').style.display = S.sec ? '' : 'none';
            $('timer').style.display = S.timer ? '' : 'none'; $('b-timer').textContent = 'Timer: ' + (S.timer ? 'an' : 'aus'); $('t-start').value = S.tStart; $('t-end').value = S.tEnd; tmState = '';
            $('b-st').textContent = 'Stil: ' + st[1]; $('b-ac').textContent = 'Akzent: ' + ac.n;
            $('b-sec').textContent = 'Sekunden: ' + (S.sec ? 'an' : 'aus'); $('b-h').textContent = S.h24 ? '24 h' : '12 h'; $('b-date').textContent = 'Datum: ' + (S.date ? 'an' : 'aus');
            $('b-tz').textContent = 'Zone: ' + (S.berlin ? 'Berlin' : 'Gerät'); makeFormatters(); render(trueNow()); fit(); updateStatus();
        }
        function toggle(k) { S[k] = !S[k]; apply(); save(); }
        function nextStyle() { S.style = (S.style + 1) % STYLES.length; apply(); save(); }
        function nextAccent() { S.acc = (S.acc + 1) % ACC.length; apply(); save(); }

        // Vollbild, Bildschirm wach halten
        function toggleFs() { if (document.fullscreenElement) document.exitFullscreen(); else (document.documentElement.requestFullscreen || (() => {})).call(document.documentElement); }
        document.addEventListener('fullscreenchange', () => { $('b-fs').textContent = document.fullscreenElement ? 'Vollbild beenden' : 'Vollbild'; setTimeout(fit, 60); });
        let lock = null;
        async function keepAwake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) { lock = null; } }
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
        document.addEventListener('click', keepAwake, { once: true });

        // Bedienleiste und Mauszeiger nach 3 Sekunden Ruhe ausblenden
        let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); };
        ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const k = e.key.toLowerCase();
            if (k === 'f') toggleFs(); else if (k === 's') toggle('sec'); else if (k === 'd') toggle('date'); else if (k === 't') nextStyle(); else if (k === 'a') nextAccent(); else if (k === 'h') toggle('h24'); else if (k === 'e') toggle('timer');
        });
        addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 120));

        apply(); tick(); wake(); keepAwake(); sync();
        setInterval(sync, 10 * 60 * 1000);                               // alle 10 Minuten neu abgleichen
        addEventListener('online', sync); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
    </script>
</body>
</html>
