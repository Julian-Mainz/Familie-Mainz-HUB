<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Rechte – J.Mainz Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-init.js"></script>
    <script src="/js/drawer.js"></script>
    <style>body { background-color: #080c14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="min-h-screen md:h-screen flex flex-col bg-[#080c14] overflow-x-hidden md:overflow-hidden p-3 md:p-6">
    <header class="flex items-center justify-between w-full px-2 py-2 min-h-[48px] mb-3 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
        <button onclick="toggleSideMenu(true)" class="flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold">
            <i class="fa-solid fa-bars text-indigo-400"></i> Menü
        </button>
        <h1 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-user-shield mr-1.5"></i> Admin & Rechte</h1>
        <button onclick="handleLogout()" class="bg-slate-900 border border-slate-800 text-slate-300 px-3.5 py-2 rounded-xl text-xs font-semibold">Ausloggen</button>
    </header>
    <main class="flex-1 w-full flex flex-col gap-4 overflow-y-auto">
        <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-lg">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h2 class="text-base font-bold text-slate-200">Mitglieder-Verwaltung</h2>
                <span id="user-count-badge" class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-xl">0 Benutzer</span>
            </div>
            <div id="admin-user-list" class="space-y-3">Lade Benutzer...</div>
        </div>
    </main>
    <script>
        const ROLES = {
            admin: { label: 'Admin', perms: { kalender: true, zeit: true, finanzen: true, tresor: true, admin: true } },
            user:  { label: 'Familie', perms: { kalender: true, zeit: true, finanzen: true, tresor: true, admin: false } },
            guest: { label: 'Gast', perms: { kalender: true, zeit: false, finanzen: false, tresor: false, admin: false } }
        };
        const MODULES = { kalender: 'Kalender', zeit: 'Zeiterfassung', finanzen: 'Finanzen', tresor: 'Safe' };
        let allUsers = [];

        initAuthGuard(user => {
            if (user) {
                renderDrawer();
                db.collection('users').onSnapshot(snapshot => {
                    allUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderAdminUserList();
                });
            }
        });

        function renderAdminUserList() {
            const listEl = document.getElementById('admin-user-list');
            if (!listEl) return;
            document.getElementById('user-count-badge').innerText = `${allUsers.length} Benutzer`;
            listEl.innerHTML = '';
            allUsers.forEach(u => {
                const self = u.id === currentUser.uid;
                const card = document.createElement('div');
                card.className = "bg-slate-950/40 border border-slate-800 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 text-xs";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-200 text-sm">${esc(u.displayName || u.email)} ${self ? '(du)' : ''}</div>
                        <div class="text-slate-500">${esc(u.email)}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <select onchange="updateRole('${u.id}', this.value)" class="bg-slate-900 border border-slate-800 text-slate-200 px-2.5 py-1.5 rounded-xl" ${self ? 'disabled' : ''}>
                            ${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${r.label}</option>`).join('')}
                        </select>
                        ${!self ? `<button onclick="deleteUser('${u.id}')" class="px-3 py-1.5 bg-rose-500/20 text-rose-400 rounded-xl">Löschen</button>` : ''}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        async function updateRole(id, role) {
            await db.collection('users').doc(id).update({ role, permissions: ROLES[role].perms });
        }
        async function deleteUser(id) {
            if (confirm('Profil wirklich löschen?')) await db.collection('users').doc(id).delete();
        }
    </script>
</body>
</html>
