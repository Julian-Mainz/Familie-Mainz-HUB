<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passwort-Safe – J.Mainz Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-init.js"></script>
    <script src="/js/drawer.js"></script>
    <style>body { background-color: #080c14; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="min-h-screen md:h-screen flex flex-col bg-[#080c14] overflow-x-hidden md:overflow-hidden p-3 md:p-6">
    <header class="flex items-center justify-between w-full px-2 py-2 min-h-[48px] mb-3 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
        <button onclick="toggleSideMenu(true)" class="flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-semibold">
            <i class="fa-solid fa-bars text-indigo-400"></i> Menü
        </button>
        <h1 class="text-sm font-bold text-slate-100"><i class="fa-solid fa-shield-halved text-amber-400 mr-1.5"></i> Passwort-Safe</h1>
        <button onclick="handleLogout()" class="bg-slate-900 border border-slate-800 text-slate-300 px-3.5 py-2 rounded-xl text-xs font-semibold">Ausloggen</button>
    </header>
    <main class="flex-1 w-full flex flex-col gap-4 overflow-y-auto">
        <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-lg flex-1 flex flex-col items-center justify-center text-center">
            <div id="vault-locked-view" class="max-w-xs space-y-3">
                <h2 class="text-lg font-bold text-slate-100">Tresor gesperrt</h2>
                <form onsubmit="unlockVault(event)" class="space-y-3">
                    <input type="password" id="vault-master-pass" required placeholder="Master-Passwort" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-center text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                    <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-2xl text-xs">Entsperren 🔓</button>
                </form>
            </div>
            <div id="vault-unlocked-view" class="hidden w-full flex-1 flex flex-col overflow-hidden text-left">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                    <h3 class="text-sm font-bold text-slate-100">Einträge</h3>
                    <button onclick="lockVault()" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold">Sperren</button>
                </div>
                <div id="vault-items-list" class="flex-1 overflow-y-auto space-y-2"></div>
            </div>
        </div>
    </main>
    <script>
        let vaultMasterKey = null;
        initAuthGuard(user => { if (user) renderDrawer(); });
        async function unlockVault(e) {
            e.preventDefault();
            vaultMasterKey = document.getElementById('vault-master-pass').value;
            document.getElementById('vault-locked-view').classList.add('hidden');
            document.getElementById('vault-unlocked-view').classList.remove('hidden');
        }
        function lockVault() { vaultMasterKey = null; document.getElementById('vault-unlocked-view').classList.add('hidden'); document.getElementById('vault-locked-view').classList.remove('hidden'); }
    </script>
</body>
</html>
